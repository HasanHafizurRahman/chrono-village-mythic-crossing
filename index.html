<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rural Bengal Bullock Cart &amp; Sauropod Dinosaur — Living Canvas Animation</title>
    <style>
        :root {
            --bg-dark: #0f1317;
            --panel-bg: rgba(15, 20, 26, 0.86);
            --panel-border: rgba(255, 255, 255, 0.16);
            --accent: #68b645;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #app-layout {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1b2228 0%, #0b0e11 100%);
            gap: 10px;
            padding: 8px 0;
        }

        body.fill-screen #app-layout {
            padding: 0;
            gap: 0;
        }

        #stage-wrapper {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #scene-canvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100vw;
            max-height: calc(100vh - 58px);
            aspect-ratio: 1000 / 411;
            object-fit: contain;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            cursor: grab;
        }

        #scene-canvas:active {
            cursor: grabbing;
        }

        body.hud-hidden #scene-canvas {
            max-height: 100vh;
        }

        body.fill-screen #scene-canvas {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            object-fit: cover;
            box-shadow: none;
        }

        #top-bar {
            position: fixed;
            top: 10px;
            left: 12px;
            right: 12px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        #status-badge {
            font-size: 11px;
            font-weight: 500;
            color: #e2e8f0;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: opacity 0.25s ease;
        }

        body.hud-hidden #status-badge {
            opacity: 0;
        }

        #btn-toggle-hud {
            pointer-events: auto;
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        #hud-bar {
            z-index: 25;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: calc(100vw - 20px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        body.fill-screen #hud-bar {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        body.hud-hidden #hud-bar {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .hud-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.09);
            color: var(--text-main);
            font-size: 11.5px;
            font-weight: 600;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.15s ease, border-color 0.15s ease;
            white-space: nowrap;
        }

        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.32);
        }

        .hud-btn.active {
            background: rgba(104, 182, 69, 0.28);
            border-color: var(--accent);
            color: #d9f99d;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-left: 8px;
            border-left: 1px solid rgba(255, 255, 255, 0.14);
        }

        .hud-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }

        .hud-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 68px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.24);
            outline: none;
            cursor: pointer;
        }

        .hud-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #ffffff;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            #status-badge {
                display: none;
            }

            #hud-bar {
                border-radius: 14px;
                padding: 6px 8px;
                gap: 5px;
            }

            .hud-slider {
                width: 50px;
            }
        }
    </style>
</head>

<body>
    <div id="top-bar">
        <div id="status-badge">Sequential Procession: Cow Cart → Dinosaur → 2 Dragons → Godzilla • Drag canvas to scrub
        </div>
        <button id="btn-toggle-hud" class="hud-btn" type="button" title="Toggle Controls">Hide Controls</button>
    </div>

    <div id="app-layout">
        <div id="stage-wrapper">
            <canvas id="scene-canvas" width="2000" height="822"
                aria-label="Animated rural bullock cart followed by a realistic sauropod dinosaur in an alternating procession"></canvas>
        </div>

        <div id="hud-bar">
            <button id="btn-play" class="hud-btn active" type="button">Pause</button>
            <button id="btn-reset" class="hud-btn" type="button">Reset Position</button>
            <button id="btn-next-stage" class="hud-btn" type="button"
                title="Jump to next creature in sequence (Cow Cart → Dinosaur → 2 Dragons)">Next: Dinosaur</button>

            <div class="hud-group">
                <span class="hud-label">Cart Speed</span>
                <input id="slider-speed" class="hud-slider" type="range" min="0" max="2.5" step="0.05" value="1.0" />
            </div>

            <div class="hud-group">
                <span class="hud-label">Breeze</span>
                <input id="slider-wind" class="hud-slider" type="range" min="0.1" max="2.5" step="0.05" value="1.0" />
            </div>

            <div class="hud-group">
                <button id="btn-mode" class="hud-btn" type="button"
                    title="Switch between Photorealistic Living Hybrid and 100% Pure Procedural Canvas Drawing">Mode:
                    Photorealistic</button>
                <button id="btn-fit" class="hud-btn" type="button"
                    title="Toggle original aspect ratio vs full viewport">Fit: Aspect</button>
                <button id="btn-audio" class="hud-btn" type="button"
                    title="Toggle synthesized rural wind, wooden cart, and sauropod footstep soundscape">Sound:
                    Off</button>
            </div>
        </div>
    </div>

            function mulberry32(seed) {
                return function () {
                    let t = (seed += 0x6d2b79f5);
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

                const flutter = Math.sin(x * 0.085 - t * 6.5 + y * 0.05) * 0.22;
                const baseBreeze = 0.42 + 0.35 * Math.sin(t * 0.75);
                return (baseBreeze + gustWave1 * 0.45 + gustWave2 + flutter) * state.windMult;

            function getRealWorldLegKinematics(hipX, hipY, baseGroundY, phase, isHind) {
                const p = ((phase % 1.0) + 1.0) % 1.0;
                const stanceRatio = 0.64;

                if (isHind) {
                    const dxFront = 14.5;
                    const dxBack = -12.0;
                    const hockFront = 3.2;
                    const hockBack = -11.4;

                    if (p < stanceRatio) {
                        const t = p / stanceRatio;
                        const hoofX = hipX + dxFront + (dxBack - dxFront) * t;
                        const groundY = baseGroundY + getRoadBumpY(hoofX);
                        const kneeX = hipX + hockFront + (hockBack - hockFront) * t;
                        const kneeY = hipY + (groundY - hipY) * 0.53;
                        return { kneeX, kneeY, hoofX, hoofY: groundY };
                    } else {
                        const t = (p - stanceRatio) / (1.0 - stanceRatio);
                        const st = t * t * (3 - 2 * t);
                        const lag = Math.sin(t * Math.PI) * 2.8;
                        const hoofX = hipX + dxBack + (dxFront - dxBack) * st - lag;
                        const groundY = baseGroundY + getRoadBumpY(hoofX);
                        const hoofY = groundY - Math.sin(t * Math.PI) * 4.4;
                        const kneeX = hipX + hockBack + (hockFront - hockBack) * st;
                        const kneeY = hipY + (groundY - hipY) * 0.53 - Math.sin(t * Math.PI) * 2.2;
                        return { kneeX, kneeY, hoofX, hoofY };
                    }
                } else {
                    const dxFront = 10.5;
                    const dxBack = -16.5;

                    if (p < stanceRatio) {
                        const t = p / stanceRatio;
                        const hoofX = hipX + dxFront + (dxBack - dxFront) * t;
                        const groundY = baseGroundY + getRoadBumpY(hoofX);
                        const kneeX = hipX + (hoofX - hipX) * 0.50 + 0.5;
                        const kneeY = hipY + (groundY - hipY) * 0.52;
                        return { kneeX, kneeY, hoofX, hoofY: groundY };
                    } else {
                        const t = (p - stanceRatio) / (1.0 - stanceRatio);
                        const st = t * t * (3 - 2 * t);
                        const hoofLag = Math.sin(t * Math.PI) * 5.6;
                        const hoofX = hipX + dxBack + (dxFront - dxBack) * st - hoofLag;
                        const groundY = baseGroundY + getRoadBumpY(hoofX);
                        const hoofY = groundY - Math.sin(t * Math.PI) * 5.0;
                        const kneeDx = dxBack * 0.50 + (dxFront * 0.55 - dxBack * 0.50) * st + Math.sin(t * Math.PI) * 2.4;
                        const kneeX = hipX + kneeDx;
                        const kneeY = hipY + (groundY - hipY) * 0.50 - Math.sin(t * Math.PI) * 2.5;
                        return { kneeX, kneeY, hoofX, hoofY };
                    }
                }
            }

            function drawAnatomicalCowLeg(hipX, hipY, phase, isHind, isNear, usePhoto) {
                const baseGroundY = isNear ? 342.8 : 341.6;
                const { kneeX, kneeY, hoofX, hoofY } = getRealWorldLegKinematics(hipX, hipY, baseGroundY, phase, isHind);

                // In Photorealistic Mode, render 1x photographic hide-textured limb sprites (zero plastic vector polygons!)
                if (usePhoto && images.cowLimbs.complete) {
                    // Sprite sheet layout (8 cols x 24px width, 36px height):
                    // Near: Col 0 = Hind Upper, Col 1 = Hind Lower, Col 2 = Front Upper, Col 3 = Front Lower
                    // Far:  Col 4 = Hind Upper, Col 5 = Hind Lower, Col 6 = Front Upper, Col 7 = Front Lower
                    const baseCol = (isNear ? 0 : 4) + (isHind ? 0 : 2);
                    const sxUpper = baseCol * 24;
                    const sxLower = (baseCol + 1) * 24;

                    // A. Upper Thigh / Forearm Sprite (Hip/Shoulder -> Hock/Knee)
                    const dxU = kneeX - hipX;
                    const dyU = kneeY - hipY;
                    const lenU = Math.hypot(dxU, dyU);
                    const angU = Math.atan2(dyU, dxU) - Math.PI * 0.5;
                    const refLenU = isHind ? 20.0 : 18.0;
                    const scaleU = lenU / refLenU;

                    ctx.save();
                    ctx.translate(hipX, hipY);
                    ctx.rotate(angU);
                    ctx.drawImage(
                        images.cowLimbs,
                        sxUpper, 0, 24, 36,
                        -12.0, -5.0 * scaleU, 24, 36 * scaleU
                    );
                    ctx.restore();

                    // B. Lower Cannon Bone + Fetlock + Hoof Sprite (Hock/Knee -> Hoof)
                    const dxL = hoofX - kneeX;
                    const dyL = hoofY - kneeY;
                    const lenL = Math.hypot(dxL, dyL);
                    const angL = Math.atan2(dyL, dxL) - Math.PI * 0.5;
                    const refLenL = 20.5;
                    const scaleL = lenL / refLenL;

                    ctx.save();
                    ctx.translate(kneeX, kneeY);
                    ctx.rotate(angL);
                    ctx.drawImage(
                        images.cowLimbs,
                        sxLower, 0, 24, 36,
                        -12.0, -5.0 * scaleL, 24, 36 * scaleL
                    );
                    ctx.restore();
                    return;
                }

                const fetX = hoofX - 0.35;
                const fetY = hoofY - 2.8;

                const wTopBack = isHind ? 6.0 : 5.0;
                const wTopFront = isHind ? 5.2 : 5.2;
                const wKneeBack = isHind ? 2.7 : 2.1;
                const wKneeFront = isHind ? 2.0 : 2.2;
                const wFet = 1.85;

                ctx.save();

                const upperGrad = ctx.createLinearGradient(hipX - wTopBack, hipY, hipX + wTopFront, hipY);
                if (isNear) {
                    upperGrad.addColorStop(0.0, "rgb(86, 54, 40)");
                    upperGrad.addColorStop(0.38, "rgb(128, 104, 92)");
                    upperGrad.addColorStop(0.72, "rgb(152, 136, 128)");
                    upperGrad.addColorStop(1.0, "rgb(172, 160, 154)");
                } else {
                    upperGrad.addColorStop(0.0, "rgb(62, 40, 30)");
                    upperGrad.addColorStop(0.45, "rgb(98, 78, 68)");
                    upperGrad.addColorStop(1.0, "rgb(126, 110, 100)");
                }

                ctx.fillStyle = upperGrad;
                ctx.beginPath();
                ctx.moveTo(hipX - wTopBack, hipY + (0));
                ctx.quadraticCurveTo(hipX, hipY - (0), hipX + wTopFront, hipY + (0));
                ctx.quadraticCurveTo(
                    (hipX + kneeX) * 0.5 + wTopFront * 0.52,
                    (hipY + kneeY) * 0.5,
                    kneeX + wKneeFront,
                    kneeY
                );
                ctx.lineTo(kneeX - wKneeBack, kneeY);
                ctx.quadraticCurveTo(
                    (hipX + kneeX) * 0.5 - wTopBack * 0.62,
                    (hipY + kneeY) * 0.5,
                    hipX - wTopBack,
                    hipY + (0)
                );
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(
                    kneeX - (wKneeBack - wKneeFront) * 0.25,
                    kneeY,
                    (wKneeBack + wKneeFront) * 0.52,
                    2.3,
                    0,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                const lowerGrad = ctx.createLinearGradient(kneeX - 3, kneeY, hoofX + 3, fetY);
                if (isNear) {
                    lowerGrad.addColorStop(0.0, "rgb(88, 58, 44)");
                    lowerGrad.addColorStop(0.55, "rgb(142, 124, 114)");
                    lowerGrad.addColorStop(1.0, "rgb(168, 154, 146)");
                } else {
                    lowerGrad.addColorStop(0.0, "rgb(64, 42, 32)");
                    lowerGrad.addColorStop(0.55, "rgb(102, 82, 72)");
                    lowerGrad.addColorStop(1.0, "rgb(124, 108, 98)");
                }

                ctx.fillStyle = lowerGrad;
                ctx.beginPath();
                ctx.moveTo(kneeX - wKneeBack * 0.84, kneeY);
                ctx.lineTo(kneeX + wKneeFront * 0.90, kneeY);
                ctx.lineTo(fetX + wFet, fetY);
                ctx.lineTo(fetX - wFet, fetY);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = isNear ? "rgba(68, 40, 28, 0.62)" : "rgba(48, 30, 22, 0.65)";
                ctx.lineWidth = 1.15;
                ctx.beginPath();
                ctx.moveTo(hipX - wTopBack + 0.8, hipY + 3);
                ctx.lineTo(kneeX - wKneeBack + 0.4, kneeY);
                ctx.lineTo(fetX - wFet + 0.4, fetY);
                ctx.stroke();

                ctx.strokeStyle = isNear ? "rgba(184, 174, 168, 0.65)" : "rgba(138, 122, 114, 0.5)";
                ctx.lineWidth = 1.0;
                ctx.beginPath();
                ctx.moveTo(hipX + wTopFront - 0.6, hipY + 3);
                ctx.lineTo(kneeX + wKneeFront - 0.4, kneeY);
                ctx.lineTo(fetX + wFet - 0.4, fetY);
                ctx.stroke();

                ctx.fillStyle = isNear ? "rgba(86, 62, 46, 0.94)" : "rgba(66, 48, 36, 0.92)";
                ctx.beginPath();
                ctx.moveTo(fetX - wFet, fetY);
                ctx.lineTo(fetX + wFet + 0.2, fetY);
                ctx.lineTo(hoofX + 2.6, hoofY);
                ctx.lineTo(hoofX - 2.2, hoofY);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            function drawWoodenWheel(cx, cy, radius, angle, isNear) {
                ctx.save();
                ctx.translate(cx, cy);

                if (isNear) {
                    const shGrad = ctx.createRadialGradient(0, radius + 0.5, 1, 0, radius + 0.5, 16);
                    shGrad.addColorStop(0, "rgba(28, 22, 15, 0.55)");
                    shGrad.addColorStop(1, "rgba(28, 22, 15, 0)");
                    ctx.fillStyle = shGrad;
                    ctx.beginPath();
                    ctx.ellipse(0, radius + 0.5, 16, 2.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.rotate(angle);

                const felloeOuter = radius - 0.8;
                const felloeInner = radius - 5.6;
                const hubRadius = 7.4;

                const numSpokes = 12;
                for (let i = 0; i < numSpokes; i++) {
                    const a = (i * Math.PI * 2) / numSpokes;
                    ctx.save();
                    ctx.rotate(a);

                    ctx.fillStyle = isNear ? "rgb(98, 84, 75)" : "rgb(68, 56, 48)";
                    ctx.beginPath();
                    ctx.moveTo(hubRadius - 1, -1.55);
                    ctx.lineTo(felloeInner + 0.8, -1.05);
                    ctx.lineTo(felloeInner + 0.8, 1.05);
                    ctx.lineTo(hubRadius - 1, 1.55);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = isNear ? "rgba(136, 122, 112, 0.75)" : "rgba(92, 78, 68, 0.6)";
                    ctx.lineWidth = 0.65;
                    ctx.beginPath();
                    ctx.moveTo(hubRadius, -1.1);
                    ctx.lineTo(felloeInner, -0.8);
                    ctx.stroke();

                    ctx.strokeStyle = isNear ? "rgba(44, 32, 24, 0.8)" : "rgba(32, 22, 18, 0.8)";
                    ctx.lineWidth = 0.75;
                    ctx.beginPath();
                    ctx.moveTo(hubRadius, 1.2);
                    ctx.lineTo(felloeInner, 0.9);
                    ctx.stroke();

                    ctx.restore();
                }

                ctx.strokeStyle = isNear ? "rgb(104, 90, 81)" : "rgb(74, 62, 54)";
                ctx.lineWidth = felloeOuter - felloeInner;
                ctx.beginPath();
                ctx.arc(0, 0, (felloeOuter + felloeInner) * 0.5, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = isNear ? "rgba(52, 40, 32, 0.65)" : "rgba(38, 28, 22, 0.65)";
                ctx.lineWidth = 0.8;
                for (let j = 0; j < 6; j++) {
                    const ja = (j * Math.PI) / 3 + 0.15;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(ja) * felloeInner, Math.sin(ja) * felloeInner);
                    ctx.lineTo(Math.cos(ja) * felloeOuter, Math.sin(ja) * felloeOuter);
                    ctx.stroke();
                }

                ctx.strokeStyle = isNear ? "rgba(48, 36, 28, 0.82)" : "rgba(34, 24, 18, 0.85)";
                ctx.lineWidth = 1.0;
                ctx.beginPath();
                ctx.arc(0, 0, felloeInner, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = isNear ? "rgb(46, 36, 30)" : "rgb(36, 28, 22)";
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                ctx.arc(0, 0, radius - 0.4, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = isNear ? "rgb(66, 52, 44)" : "rgb(48, 38, 32)";
                ctx.beginPath();
                ctx.arc(0, 0, hubRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "rgb(36, 26, 20)";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.arc(0, 0, hubRadius - 0.5, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = isNear ? "rgb(112, 98, 90)" : "rgb(78, 66, 58)";
                ctx.beginPath();
                ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "rgb(38, 28, 22)";
                ctx.beginPath();
                ctx.arc(0, 0, 1.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // -------------------------------------------------------------------------
            // 2. REAL-WORLD SAUROPOD DINOSAUR BIOMECHANICS, 3-JOINT LIMBS & FOOTSTEPS
            // -------------------------------------------------------------------------
            function getSauropodLegKinematics(hipX, hipY, baseGroundY, phase, isHind) {
                const p = ((phase % 1.0) + 1.0) % 1.0;
                const stanceRatio = 0.65;

                if (isHind) {
                    const dxFront = 18.0;
                    const dxBack = -36.0;

                    if (p < stanceRatio) {
                        const t = p / stanceRatio;
                        const footX = hipX + dxFront + (dxBack - dxFront) * t;
                        const groundY = baseGroundY + getRoadBumpY(footX);
                        const kneeBend = -3.8 * Math.sin(t * Math.PI);
                        const kneeX = hipX + (footX - hipX) * 0.46 + kneeBend;
                        const kneeY = hipY + (groundY - hipY) * 0.47;
                        const footTilt = t > 0.84 ? ((t - 0.84) / 0.16) * 0.34 : 0.0;
                        const weightSquash = Math.sin(t * Math.PI) * 0.09;
                        const impactProg = t < 0.28 ? t / 0.28 : -1.0;
                        return { kneeX, kneeY, footX, footY: groundY, footTilt, weightSquash, impactProg };
                    } else {
                        const t = (p - stanceRatio) / (1.0 - stanceRatio);
                        const st = t * t * (3 - 2 * t);
                        const lag = Math.sin(t * Math.PI) * 4.8;
                        const footX = hipX + dxBack + (dxFront - dxBack) * st - lag;
                        const groundY = baseGroundY + getRoadBumpY(footX);
                        const lift = Math.sin(t * Math.PI) * 7.8;
                        const footY = groundY - lift;
                        const kneeX = hipX + (footX - hipX) * 0.48 + Math.sin(t * Math.PI) * 3.5;
                        const kneeY = hipY + (groundY - hipY) * 0.45 - lift * 0.45;
                        const footTilt = Math.sin(Math.pow(t, 0.75) * Math.PI) * 0.46 * (1.0 - t * 0.55);
                        return { kneeX, kneeY, footX, footY, footTilt, weightSquash: 0.0, impactProg: -1.0 };
                    }
                } else {
                    const dxFront = 24.0;
                    const dxBack = -24.0;

                    if (p < stanceRatio) {
                        const t = p / stanceRatio;
                        const footX = hipX + dxFront + (dxBack - dxFront) * t;
                        const groundY = baseGroundY + getRoadBumpY(footX);
                        const kneeX = hipX + (footX - hipX) * 0.45 - 2.0 * Math.sin(t * Math.PI);
                        const kneeY = hipY + (groundY - hipY) * 0.46;
                        const footTilt = t > 0.82 ? ((t - 0.82) / 0.18) * 0.42 : 0.0;
                        const weightSquash = Math.sin(t * Math.PI) * 0.08;
                        const impactProg = t < 0.28 ? t / 0.28 : -1.0;
                        return { kneeX, kneeY, footX, footY: groundY, footTilt, weightSquash, impactProg };
                    } else {
                        const t = (p - stanceRatio) / (1.0 - stanceRatio);
                        const st = t * t * (3 - 2 * t);
                        const lag = Math.sin(t * Math.PI) * 6.0;
                        const footX = hipX + dxBack + (dxFront - dxBack) * st - lag;
                        const groundY = baseGroundY + getRoadBumpY(footX);
                        const lift = Math.sin(t * Math.PI) * 8.5;
                        const footY = groundY - lift;
                        const kneeX = hipX + (footX - hipX) * 0.43 - Math.sin(t * Math.PI) * 2.2;
                        const kneeY = hipY + (groundY - hipY) * 0.44 - lift * 0.42;
                        const footTilt = Math.sin(Math.pow(t, 0.7) * Math.PI) * 0.56 * (1.0 - t * 0.5);
                        return { kneeX, kneeY, footX, footY, footTilt, weightSquash: 0.0, impactProg: -1.0 };
                    }
                }
            }

            // Renders compressed dirt footprint tracks left behind on the embankment by the dinosaur's massive feet
            function drawDinoFootprintTracks(dinoX) {
                const stepSpacing = 27.0;
                const maxTrackX = 325 + dinoX;
                const minTrackX = Math.max(-20, maxTrackX - 280);
                const startIdx = Math.floor(minTrackX / stepSpacing);
                const endIdx = Math.floor(maxTrackX / stepSpacing);

                for (let idx = startIdx; idx <= endIdx; idx++) {
                    const fx = idx * stepSpacing + ((idx % 2) * 4.5);
                    if (fx < -15 || fx > LOGICAL_W + 15 || fx > maxTrackX) continue;
                    const distBehind = maxTrackX - fx;
                    const fade = Math.max(0, Math.min(1, 1.0 - distBehind / 270.0));
                    const fy = 340.6 + getRoadBumpY(fx) + ((idx % 2) * 0.8);

                    ctx.fillStyle = `rgba(146, 128, 102, ${(0.38 * fade).toFixed(3)})`;
                    ctx.beginPath();
                    ctx.ellipse(fx, fy + 0.3, 12.5, 2.3, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = `rgba(42, 32, 22, ${(0.46 * fade).toFixed(3)})`;
                    ctx.beginPath();
                    ctx.ellipse(fx + 0.5, fy, 10.2, 1.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Renders billowing dust shockwaves and flying soil clods/pebbles when a massive sauropod foot impacts the dirt
            function drawDinoFootstepImpact(footX, groundY, impactProg, isNear) {
                if (impactProg < 0 || impactProg > 1) return;
                const env = Math.sin(impactProg * Math.PI);
                const spread = 6.0 + impactProg * 22.0;

                ctx.save();
                const dustAlpha = env * (isNear ? 0.38 : 0.25);
                for (let side = -1; side <= 1; side += 2) {
                    const px = footX + side * spread - impactProg * 6.0 * state.windMult;
                    const py = groundY - 1.5 - impactProg * 4.5;
                    const pr = 4.5 + impactProg * 8.5;
                    const dGrad = ctx.createRadialGradient(px, py, 0.5, px, py, pr);
                    dGrad.addColorStop(0, `rgba(156, 140, 118, ${dustAlpha.toFixed(3)})`);
                    dGrad.addColorStop(0.6, `rgba(138, 122, 100, ${(dustAlpha * 0.55).toFixed(3)})`);
                    dGrad.addColorStop(1, "rgba(138, 122, 100, 0)");
                    ctx.fillStyle = dGrad;
                    ctx.beginPath();
                    ctx.ellipse(px, py, pr * 1.35, pr * 0.75, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                const clodOffsets = [-11, -6, -2, 4, 9, 13];
                for (let c = 0; c < clodOffsets.length; c++) {
                    const vx = clodOffsets[c] * 1.35;
                    const vy0 = 14.0 + (c % 3) * 5.5;
                    const cx = footX + vx * impactProg;
                    const cy = groundY - Math.max(0, vy0 * impactProg * (1.0 - impactProg) * 1.8);
                    const cAlpha = (1.0 - impactProg * 0.85) * (isNear ? 0.78 : 0.55);
                    ctx.fillStyle = c % 2 === 0
                        ? `rgba(74, 58, 40, ${cAlpha.toFixed(2)})`
                        : `rgba(116, 98, 74, ${cAlpha.toFixed(2)})`;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 0.85 + (c % 2) * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // Renders a single 3-joint articulated Sauropod Leg (Upper Thigh/Arm -> Lower Shin/Forearm -> Independent Flat 3-Toed Cushion Foot)
            function drawSauropodLeg(hipX, hipY, phase, isHind, isNear, usePhoto, isMoving) {
                const baseGroundY = isNear ? 340.8 : 339.6;
                const { kneeX, kneeY, footX, footY, footTilt, weightSquash, impactProg } = getSauropodLegKinematics(
                    hipX, hipY, baseGroundY, phase, isHind
                );

                const ankleX = footX - Math.sin(footTilt) * 9.5;
                const ankleY = footY - 11.5 * Math.cos(footTilt);

                ctx.save();

                const groundAtFoot = baseGroundY + getRoadBumpY(footX);
                const distFromGround = Math.max(0, groundAtFoot - footY);
                const shadowAlpha = Math.max(0.14, 0.52 - distFromGround * 0.035);
                const shadowRx = (isHind ? 19 : 16) * (1.0 + weightSquash * 0.5);
                const fShGrad = ctx.createRadialGradient(footX + 2, groundAtFoot + 0.8, 2, footX + 2, groundAtFoot + 0.8, shadowRx);
                fShGrad.addColorStop(0, `rgba(22, 16, 10, ${shadowAlpha.toFixed(2)})`);
                fShGrad.addColorStop(1, "rgba(22, 16, 10, 0)");
                ctx.fillStyle = fShGrad;
                ctx.beginPath();
                ctx.ellipse(footX + 2, groundAtFoot + 0.8, shadowRx, 3.2, 0, 0, Math.PI * 2);
                ctx.fill();

                if (usePhoto && images.dinoLimbs.complete) {
                    const baseCol = (isNear ? 0 : 6) + (isHind ? 0 : 3);
                    const sxUpper = baseCol * 48;
                    const sxLower = (baseCol + 1) * 48;
                    const sxFoot = (baseCol + 2) * 48;

                    const dxU = kneeX - hipX;
                    const dyU = kneeY - hipY;
                    const lenU = Math.hypot(dxU, dyU);
                    const angU = Math.atan2(dyU, dxU) - Math.PI * 0.5;
                    const refLenU = isHind ? 36.0 : 31.0;
                    const scaleU = lenU / refLenU;
                    const pivotUx = isHind ? 22.0 : 19.0;

                    ctx.save();
                    ctx.translate(hipX, hipY);
                    ctx.rotate(angU);
                    ctx.drawImage(images.dinoLimbs, sxUpper, 0, 48, 60, -pivotUx, -12.0 * scaleU, 48, 60 * scaleU);
                    ctx.restore();

                    const dxL = ankleX - kneeX;
                    const dyL = ankleY - kneeY;
                    const lenL = Math.hypot(dxL, dyL);
                    const angL = Math.atan2(dyL, dxL) - Math.PI * 0.5;
                    const refLenL = isHind ? 33.0 : 32.0;
                    const scaleL = lenL / refLenL;

                    ctx.save();
                    ctx.translate(kneeX, kneeY);
                    ctx.rotate(angL);
                    ctx.drawImage(images.dinoLimbs, sxLower, 0, 48, 60, -22.0, -7.5 * scaleL, 48, 60 * scaleL);
                    ctx.restore();

                    const squashY = 1.0 - weightSquash;
                    const spreadX = 1.0 + weightSquash * 0.75;
                    ctx.save();
                    ctx.translate(ankleX, ankleY);
                    ctx.rotate(footTilt);
                    ctx.scale(spreadX, squashY);
                    ctx.drawImage(images.dinoLimbs, sxFoot, 0, 48, 24, -22.0, -6.0, 48, 24);
                    ctx.restore();

                    if (isMoving && impactProg >= 0) {
                        drawDinoFootstepImpact(footX, groundAtFoot, impactProg, isNear);
                    }

                    ctx.restore();
                    return;
                }

                const wTopBack = isHind ? 16.5 : 12.5;
                const wTopFront = isHind ? 15.0 : 12.0;
                const wKneeBack = isHind ? 9.8 : 7.5;
                const wKneeFront = isHind ? 9.2 : 7.2;
                const wAnkleBack = isHind ? 7.6 : 6.0;
                const wAnkleFront = isHind ? 7.2 : 5.8;

                const skinGrad = ctx.createLinearGradient(hipX - wTopBack, hipY, kneeX + wKneeFront, kneeY);
                if (isNear) {
                    skinGrad.addColorStop(0.0, "rgb(52, 44, 37)");
                    skinGrad.addColorStop(0.45, "rgb(92, 81, 72)");
                    skinGrad.addColorStop(1.0, "rgb(126, 115, 106)");
                } else {
                    skinGrad.addColorStop(0.0, "rgb(36, 30, 25)");
                    skinGrad.addColorStop(0.5, "rgb(64, 56, 48)");
                    skinGrad.addColorStop(1.0, "rgb(92, 82, 74)");
                }

                ctx.fillStyle = skinGrad;
                ctx.beginPath();
                ctx.moveTo(hipX - wTopBack, hipY);
                ctx.lineTo(hipX + wTopFront, hipY);
                ctx.lineTo(kneeX + wKneeFront, kneeY);
                ctx.lineTo(kneeX - wKneeBack, kneeY);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(kneeX - wKneeBack, kneeY);
                ctx.lineTo(kneeX + wKneeFront, kneeY);
                ctx.lineTo(ankleX + wAnkleFront, ankleY);
                ctx.lineTo(ankleX - wAnkleBack, ankleY);
                ctx.closePath();
                ctx.fill();

                ctx.save();
                ctx.translate(ankleX, ankleY);
                ctx.rotate(footTilt);
                ctx.beginPath();
                ctx.moveTo(-wAnkleBack, 0);
                ctx.lineTo(wAnkleFront, 0);
                ctx.lineTo(wAnkleFront + 5, 11.5);
                ctx.lineTo(-wAnkleBack - 2, 11.5);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                if (isMoving && impactProg >= 0) {
                    drawDinoFootstepImpact(footX, groundAtFoot, impactProg, isNear);
                }

                ctx.restore();
            }

            function drawProceduralDinoUpper(dinoX, dinoBobY, dinoPhase) {
                ctx.save();
                ctx.translate(dinoX, dinoBobY);

                const bodyGrad = ctx.createLinearGradient(290, 182, 370, 272);
                bodyGrad.addColorStop(0.0, "rgb(134, 124, 115)");
                bodyGrad.addColorStop(0.45, "rgb(104, 92, 82)");
                bodyGrad.addColorStop(0.82, "rgb(72, 62, 54)");

            function renderDinosaurInstance(dinoX, dinoPhase, usePhoto) {
                if (585 + dinoX < -20 || 30 + dinoX > LOGICAL_W + 20) return;

                const isMoving = state.playing && state.speedMult > 0.01;
                const strideScale = isMoving ? 1.0 : 0.0;
                const groundBump = getRoadBumpY(350 + dinoX);

                const stepFrac = ((dinoPhase * 4.0) % 1.0 + 1.0) % 1.0;
                const impactTremor = isMoving && stepFrac < 0.22
                    ? Math.exp(-stepFrac * 18.0) * Math.sin(stepFrac * 85.0) * 0.95
                    : 0.0;
                const dinoBobY = groundBump * 0.9 + Math.sin(dinoPhase * Math.PI * 4) * 1.45 * strideScale + impactTremor;

                // 0. Persistent Compressed Dirt Footprint Tracks trailed behind the dinosaur on the embankment!
                drawDinoFootprintTracks(dinoX);

                const bodyShGrad = ctx.createRadialGradient(
                    345 + dinoX, 340.2, 8,
                    345 + dinoX, 340.2, 96
                );
                bodyShGrad.addColorStop(0, "rgba(24, 18, 12, 0.45)");
                bodyShGrad.addColorStop(1, "rgba(24, 18, 12, 0)");
                ctx.fillStyle = bodyShGrad;
                ctx.beginPath();
                ctx.ellipse(345 + dinoX, 340.2, 96, 4.2, 0, 0, Math.PI * 2);
                ctx.fill();

                // 1. Far-side (Left) Legs: Far Hind Leg (+0.52) & Far Front Leg (+0.27)
                drawSauropodLeg(298 + dinoX, 253 + dinoBobY, dinoPhase + 0.52, true, false, usePhoto, isMoving);
                drawSauropodLeg(374 + dinoX, 255 + dinoBobY, dinoPhase + 0.27, false, false, usePhoto, isMoving);

                // 2. Near-side (Right) Legs: Near Hind Leg (+0.02) & Near Front Leg (+0.77)
                drawSauropodLeg(317 + dinoX, 251 + dinoBobY, dinoPhase + 0.02, true, true, usePhoto, isMoving);
                drawSauropodLeg(398 + dinoX, 252 + dinoBobY, dinoPhase + 0.77, false, true, usePhoto, isMoving);

                // 3. Dinosaur Upper Body, Undulating Tail, and Gently Swaying Long Neck & Head
                if (usePhoto) {
                    const stripW = 8;
                    const totalW = 548;
                    for (let lx = 0; lx < totalW; lx += stripW) {
                        const wSlice = Math.min(stripW, totalW - lx);
                        let waveY = 0;
                        if (lx < 235) {
                            const tailFrac = (235 - lx) / 235;
                            waveY = Math.sin(dinoPhase * Math.PI * 4 - tailFrac * 2.6) * 4.2 * (tailFrac * tailFrac) * strideScale;
                        } else if (lx > 385) {
                            const neckFrac = (lx - 385) / 163;
                            waveY = Math.sin(dinoPhase * Math.PI * 4 - 0.8 - neckFrac * 1.4) * 3.4 * Math.pow(neckFrac, 1.25) * strideScale;
                        }
                        ctx.drawImage(
                            images.dinoBody,
                            lx, 0, wSlice, 157,
                            32 + lx + dinoX, 118 + dinoBobY + waveY, wSlice + 0.75, 157
                        );
                    }
                } else {
                    drawProceduralDinoUpper(dinoX, dinoBobY, dinoPhase);
                }
            }
