                    fetch(roarUrl)
                        .then(r => { if (!r.ok) throw new Error(r.statusText); return r.arrayBuffer(); })
                        .then(buf => decodeData(buf, (d) => { godzillaRoarAudioBuffer = d; }))
                        .catch(() => {
                            if (AUDIO_ASSETS.godzillaRoar) {
                                decodeData(base64ToArrayBuffer(AUDIO_ASSETS.godzillaRoar), (d) => { godzillaRoarAudioBuffer = d; });
                            }
                        });

                    const footUrl = encodeURI("Godzilla footstep sound.mp3");
                    fetch(footUrl)
                        .then(r => { if (!r.ok) throw new Error(r.statusText); return r.arrayBuffer(); })
                        .then(buf => decodeData(buf, (d) => { godzillaFootstepAudioBuffer = d; }))
                        .catch(() => {
                            if (AUDIO_ASSETS.godzillaFootstep) {
                                decodeData(base64ToArrayBuffer(AUDIO_ASSETS.godzillaFootstep), (d) => { godzillaFootstepAudioBuffer = d; });
                            }
                        });
                }
            }
            function triggerGodzillaStomp(xPos) {
                if (!audioCtx || !state.audioEnabled) return;
                const { proximity, pan } = getSpatialAudioParams(xPos);
                if (proximity < 0.02) return;

                const now = audioCtx.currentTime;
                const panner = createPanner(pan);

                // 1. Authentic recorded Godzilla footstep sound effect
                if (godzillaFootstepAudioBuffer) {
                    try {
                        const stepSrc = audioCtx.createBufferSource();
                        stepSrc.buffer = godzillaFootstepAudioBuffer;

                        // Subtle pitch variation between left and right foot (0.94x - 1.04x)
                        const pitchVariance = 0.94 + (godzillaStepCounter % 2) * 0.10 + (Math.random() * 0.04 - 0.02);
                        stepSrc.playbackRate.setValueAtTime(pitchVariance, now);
                        godzillaStepCounter++;

                        const stepGain = audioCtx.createGain();
                        const peakVol = 0.95 * Math.min(1.0, proximity * 1.35);
                        stepGain.gain.setValueAtTime(peakVol, now);
                        stepGain.gain.exponentialRampToValueAtTime(0.001, now + 1.40);

                        stepSrc.connect(stepGain);
                        stepGain.connect(panner);
                        stepSrc.start(now);
                    } catch (e) {
                        console.warn("Footstep sample trigger error:", e);
                    }
                }

                // 2. Heavy layered seismic sub-bass tremor (68 Hz -> 18 Hz)
                const stompOsc = audioCtx.createOscillator();
                stompOsc.type = "sine";
                stompOsc.frequency.setValueAtTime(68, now);
                stompOsc.frequency.exponentialRampToValueAtTime(18, now + 0.55);

                const stompGain = audioCtx.createGain();
                const peak = (godzillaFootstepAudioBuffer ? 0.38 : 0.48) * proximity;
                stompGain.gain.setValueAtTime(0.001, now);
                stompGain.gain.linearRampToValueAtTime(peak, now + 0.02);
                stompGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.60);

                stompOsc.connect(stompGain);
                stompGain.connect(panner);
                stompOsc.start(now);
                stompOsc.stop(now + 0.62);

                // 3. Earth crumble & shockwave debris
                const rockSrc = audioCtx.createBufferSource();
                rockSrc.buffer = noiseBuffer;
                const rockFilter = audioCtx.createBiquadFilter();
                rockFilter.type = "lowpass";
                rockFilter.frequency.setValueAtTime(280, now);
                rockFilter.frequency.exponentialRampToValueAtTime(70, now + 0.45);
                const rockGain = audioCtx.createGain();
                rockGain.gain.setValueAtTime(0.001, now);
                rockGain.gain.linearRampToValueAtTime(0.18 * proximity, now + 0.03);
                rockGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);

                rockSrc.connect(rockFilter);
                rockFilter.connect(rockGain);
                rockGain.connect(panner);
                rockSrc.start(now, Math.random() * 2.0, 0.50);
            }

            function triggerGodzillaRoar(xPos) {
                if (!audioCtx || !state.audioEnabled) return;
                const { proximity, pan } = getSpatialAudioParams(xPos);
                if (proximity < 0.08) return;

                const now = audioCtx.currentTime;
                const panner = createPanner(pan);

                // 1. Authentic recorded Godzilla roar sound effect
                if (godzillaRoarAudioBuffer) {
                    try {
                        const roarSrc = audioCtx.createBufferSource();
                        roarSrc.buffer = godzillaRoarAudioBuffer;

                        const roarGain = audioCtx.createGain();
                        const peak = 1.0 * proximity;
                        roarGain.gain.setValueAtTime(0.001, now);
                        roarGain.gain.linearRampToValueAtTime(peak, now + 0.15);
                        roarGain.gain.setValueAtTime(peak, now + 5.2);
                        roarGain.gain.exponentialRampToValueAtTime(0.001, now + 6.5);

                        roarSrc.connect(roarGain);
                        roarGain.connect(panner);
                        roarSrc.start(now);
                    } catch (e) {
                        console.warn("Roar sample trigger error:", e);
                    }
                }

                // 2. Cavernous chest bellow sub-harmonics layer
                const chestOsc = audioCtx.createOscillator();
                chestOsc.type = "sawtooth";
                chestOsc.frequency.setValueAtTime(64, now);
                chestOsc.frequency.linearRampToValueAtTime(88, now + 0.4);
                chestOsc.frequency.exponentialRampToValueAtTime(42, now + 3.0);

                const resFilter = audioCtx.createBiquadFilter();
                resFilter.type = "bandpass";
                resFilter.frequency.setValueAtTime(320, now);
                resFilter.frequency.linearRampToValueAtTime(540, now + 0.35);
                resFilter.frequency.exponentialRampToValueAtTime(210, now + 3.0);
                resFilter.Q.value = 2.8;

                const rGain = audioCtx.createGain();
                const peakSynth = (godzillaRoarAudioBuffer ? 0.05 : 0.09) * proximity;
                rGain.gain.setValueAtTime(0.0001, now);
                rGain.gain.linearRampToValueAtTime(peakSynth, now + 0.22);
                rGain.gain.setValueAtTime(peakSynth * 0.85, now + 1.8);
                rGain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

                chestOsc.connect(resFilter);
                resFilter.connect(rGain);
                rGain.connect(panner);

                chestOsc.start(now);
                chestOsc.stop(now + 3.05);
            }

            function initOrToggleAudio() {
                const btnAudio = document.getElementById("btn-audio");
                if (!audioCtx) {
                    if (!ensureAudioInitialized()) return;
                    state.audioEnabled = true;
                } else {
                    state.audioEnabled = !state.audioEnabled;
                    if (state.audioEnabled && audioCtx.state === "suspended") {
                        audioCtx.resume();
                    }
                }
                btnAudio.textContent = state.audioEnabled ? "Sound: On" : "Sound: Off";
                btnAudio.classList.toggle("active", state.audioEnabled);
            }

            // Auto-unlock audio on first canvas/button gesture unless explicitly toggled off by user
            let autoUnlockedOnce = false;
            function autoUnlockAudioOnGesture(e) {
                if (autoUnlockedOnce) return;
                if (e && e.target && e.target.id === "btn-audio") {
                    autoUnlockedOnce = true;
                    return;
                }
                autoUnlockedOnce = true;
                if (!audioCtx && ensureAudioInitialized()) {
                    state.audioEnabled = true;
                    if (audioCtx.state === "suspended") audioCtx.resume();
                    const btnAudio = document.getElementById("btn-audio");
                    if (btnAudio) {
                        btnAudio.textContent = "Sound: On";
                        btnAudio.classList.add("active");
                    }
                }
            }
            window.addEventListener("pointerdown", autoUnlockAudioOnGesture, { once: true });

            function updateAudio(t) {
                if (!audioCtx || !state.audioEnabled) {
                    if (windLowGain) windLowGain.gain.setTargetAtTime(0, audioCtx ? audioCtx.currentTime : 0, 0.05);
                    if (windHighGain) windHighGain.gain.setTargetAtTime(0, audioCtx ? audioCtx.currentTime : 0, 0.05);
                    if (creakGain) creakGain.gain.setTargetAtTime(0, audioCtx ? audioCtx.currentTime : 0, 0.05);
                    return;
                }
                if (audioCtx.state === "suspended") {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                // 1. Continuous Breeze & Rustling Paddy/Trees (modulated by real-time wind wave & Breeze slider)
                const fieldWind = Math.abs(getWindAt(500, 360, t));
                const lowWindLevel = Math.min(0.24, (0.045 + fieldWind * 0.055) * state.windMult);
                const highRustleLevel = Math.min(0.09, (0.012 + fieldWind * 0.024) * state.windMult);
                windLowGain.gain.setTargetAtTime(lowWindLevel, now, 0.08);
                windLowFilter.frequency.setTargetAtTime(190 + fieldWind * 140 * state.windMult, now, 0.10);
                windHighGain.gain.setTargetAtTime(highRustleLevel, now, 0.08);
                windHighFilter.frequency.setTargetAtTime(1500 + fieldWind * 650, now, 0.10);

                const isMoving = state.playing && state.speedMult > 0.02;
                const u = ((state.travelDist % CYCLE_SPAN) + CYCLE_SPAN) % CYCLE_SPAN;
                const s2End = CART_PHASE_SPAN + DINO_PHASE_SPAN;
                const s3End = s2End + DRAGONS_PHASE_SPAN;

                // Default creak off unless in Stage 1 (Cow Cart)
                if (u >= CART_PHASE_SPAN || !isMoving) {
                    creakGain.gain.setTargetAtTime(0, now, 0.05);
                }

                if (u < CART_PHASE_SPAN) {
                    // --- STAGE 1: COW CART & ZEBU CATTLE ---
                    const cartX = -425 + u;
                    const centerCartX = 280 + cartX;
                    const { proximity, pan } = getSpatialAudioParams(centerCartX);
                    if (creakPanner && creakPanner.pan) {
                        creakPanner.pan.setTargetAtTime(pan, now, 0.05);
                    }

                    if (isMoving) {
                        // Wooden wheel rotation creak
                        const wheelPhase = (u / 35.5) % (Math.PI * 2);
                        const creakPulse = Math.pow(Math.max(0, Math.sin(wheelPhase * 2)), 6);
                        creakOsc.frequency.setTargetAtTime(110 + creakPulse * 55, now, 0.03);
                        creakFilter.frequency.setTargetAtTime(280 + creakPulse * 140, now, 0.03);
                        creakGain.gain.setTargetAtTime(
                            creakPulse * 0.026 * proximity * Math.min(1.5, state.speedMult),
                            now,
                            0.03
                        );

                        // 4-beat cow hoof steps & brass neck bell
                        const walkPhaseCart = (u - 425) / 26.5;
                        const cowStepIdx = Math.floor(walkPhaseCart * 4.0);
                        if (cowStepIdx !== audioTrackers.lastCowStepIndex) {
                            audioTrackers.lastCowStepIndex = cowStepIdx;
                            triggerCowHoofAndBell(340 + cartX, Math.abs(cowStepIdx));
                        }

                        // Periodic gentle bovine lowing (moo) when near mid-screen
                        if (proximity > 0.45 && t - audioTrackers.lastCowMooTime > 7.5) {
                            audioTrackers.lastCowMooTime = t;
                            triggerCowMoo(385 + cartX);
                        }
                    }
                } else if (u < s2End) {
                    // --- STAGE 2: SAUROPOD DINOSAUR ---
                    const dinoU = u - CART_PHASE_SPAN;
                    const dinoX = -585 + dinoU;
                    const walkPhaseDino = (dinoU - 585) / 54.0;

                    if (isMoving) {
                        // Trigger heavy sauropod footstep boom for each of the 4 legs at touchdown!
                        const legOffsets = [0.02, 0.27, 0.52, 0.77];
                        const legXOffsets = [317, 374, 298, 398];
                        for (let i = 0; i < 4; i++) {
                            const sIdx = Math.floor(walkPhaseDino + legOffsets[i]);
                            if (sIdx !== audioTrackers.lastDinoStepIndices[i]) {
                                audioTrackers.lastDinoStepIndices[i] = sIdx;
                                triggerSauropodFootstep(legXOffsets[i] + dinoX);
                            }
                        }

                        // Deep resonant sauropod bellow when crossing mid-screen
                        const { proximity } = getSpatialAudioParams(350 + dinoX);
                        if (proximity > 0.5 && t - audioTrackers.lastDinoCallTime > 8.0) {
                            audioTrackers.lastDinoCallTime = t;
                            triggerSauropodBellow(480 + dinoX);
                        }
                    }
                } else if (u < s3End) {
                    // --- STAGE 3: 2 LOW-ORBIT FLYING DRAGONS ---
                    const dragU = u - s2End;
                    const leadDragonX = -310 + (dragU / DRAGONS_PHASE_SPAN) * 1550;
                    const dragon2X = leadDragonX - 215;

                    // Wing-whoosh beats synchronized with both dragons' power downstrokes!
                    const flap1Idx = Math.floor((t * 6.4 - 1.2) / (Math.PI * 2));
                    if (flap1Idx !== audioTrackers.lastDragonFlap1) {
                        audioTrackers.lastDragonFlap1 = flap1Idx;
                        triggerDragonWingFlap(leadDragonX + 160, 1.02);
                    }

                    const flap2Idx = Math.floor((t * 6.8 + 2.1 - 1.2) / (Math.PI * 2));
                    if (flap2Idx !== audioTrackers.lastDragonFlap2) {
                        audioTrackers.lastDragonFlap2 = flap2Idx;
                        triggerDragonWingFlap(dragon2X + 140, 0.84);
                    }

                    // Guttural draconic roar as the pair swoops across the center sky
                    const { proximity } = getSpatialAudioParams(leadDragonX + 150);
                    if (proximity > 0.55 && t - audioTrackers.lastDragonRoarTime > 6.5) {
                        audioTrackers.lastDragonRoarTime = t;
                        triggerDragonRoar(leadDragonX + 220);
                    }
                } else {
                    // --- STAGE 4: BIPEDAL KAIJU GODZILLA ---
                    const godzU = u - s3End;
                    const godzillaX = -355 + godzU;
                    const walkPhaseGodzilla = (godzU - 355) / 64.0;

                    if (isMoving) {
                        // Thunderous bipedal footsteps for Far Leg (+0.12) and Near Leg (+0.62)
                        const gOffsets = [0.12, 0.62];
                        const gXOffsets = [248, 212];
                        for (let i = 0; i < 2; i++) {
                            const gIdx = Math.floor(walkPhaseGodzilla + gOffsets[i]);
                            if (gIdx !== audioTrackers.lastGodzillaStepIndices[i]) {
                                audioTrackers.lastGodzillaStepIndices[i] = gIdx;
                                triggerGodzillaStomp(gXOffsets[i] + godzillaX);
                            }
                        }

                        // Iconic metallic-resonant Godzilla roar when stomping across mid-screen
                        const { proximity } = getSpatialAudioParams(230 + godzillaX);
                        if (proximity > 0.55 && t - audioTrackers.lastGodzillaRoarTime > 7.5) {
                            audioTrackers.lastGodzillaRoarTime = t;
                            triggerGodzillaRoar(290 + godzillaX);
                        }
                    }
                }
            }

            // -------------------------------------------------------------------------
            // UI CONTROLS & DRAG INTERACTIVITY
            // -------------------------------------------------------------------------
            const btnPlay = document.getElementById("btn-play");
            const btnReset = document.getElementById("btn-reset");
            const btnMode = document.getElementById("btn-mode");
            const btnFit = document.getElementById("btn-fit");
            const btnAudio = document.getElementById("btn-audio");
            const btnToggleHud = document.getElementById("btn-toggle-hud");
            const statusBadge = document.getElementById("status-badge");
            const sliderSpeed = document.getElementById("slider-speed");
            const sliderWind = document.getElementById("slider-wind");

            btnPlay.addEventListener("click", () => {
                state.playing = !state.playing;
                btnPlay.textContent = state.playing ? "Pause" : "Play";
                btnPlay.classList.toggle("active", state.playing);
            });

            const btnNextStage = document.getElementById("btn-next-stage");

            function updateStageButtonLabel() {
                const u = ((state.travelDist % CYCLE_SPAN) + CYCLE_SPAN) % CYCLE_SPAN;
                const s2End = CART_PHASE_SPAN + DINO_PHASE_SPAN;
                const s3End = s2End + DRAGONS_PHASE_SPAN;
                if (u < CART_PHASE_SPAN) {
                    btnNextStage.textContent = "Next: Dinosaur";
                } else if (u < s2End) {
                    btnNextStage.textContent = "Next: 2 Dragons";
                } else if (u < s3End) {
                    btnNextStage.textContent = "Next: Godzilla";
                } else {
                    btnNextStage.textContent = "Next: Cow Cart";
                }
            }

            btnReset.addEventListener("click", () => {
                state.travelDist = 425;
                updateStageButtonLabel();
            });

            btnNextStage.addEventListener("click", () => {
                const u = ((state.travelDist % CYCLE_SPAN) + CYCLE_SPAN) % CYCLE_SPAN;
                const s2End = CART_PHASE_SPAN + DINO_PHASE_SPAN;
                const s3End = s2End + DRAGONS_PHASE_SPAN;
                if (u < CART_PHASE_SPAN) {
                    // Jump to Dinosaur centered on embankment
                    state.travelDist = CART_PHASE_SPAN + 585;
                } else if (u < s2End) {
                    // Jump to 2 Low-Orbit Dragons flying mid-scene
                    state.travelDist = s2End + 820;
                } else if (u < s3End) {
                    // Jump to Godzilla stomping mid-scene
                    state.travelDist = s3End + 640;
                } else {
                    // Jump back to Cow Cart reference position
                    state.travelDist = 425;
                }
                updateStageButtonLabel();
            });

            btnMode.addEventListener("click", () => {
                state.renderMode = state.renderMode === "photorealistic" ? "procedural" : "photorealistic";
                const isPhoto = state.renderMode === "photorealistic";
                btnMode.textContent = isPhoto ? "Mode: Photorealistic" : "Mode: Pure Procedural JS";
                btnMode.classList.toggle("active", !isPhoto);
                statusBadge.textContent = isPhoto
                    ? "Alternating Procession: Cow Cart → Dinosaur → Cow Cart → Dinosaur • Drag canvas to scrub"
                    : "100% Pure Procedural Canvas 2D Mode • Cow Cart → Dinosaur Procession";
            });

            btnFit.addEventListener("click", () => {
                state.fillScreen = !state.fillScreen;
                document.body.classList.toggle("fill-screen", state.fillScreen);
                btnFit.textContent = state.fillScreen ? "Fit: Fullscreen" : "Fit: Aspect";
                btnFit.classList.toggle("active", state.fillScreen);
            });

            btnAudio.addEventListener("click", initOrToggleAudio);

            btnToggleHud.addEventListener("click", () => {
                state.hudVisible = !state.hudVisible;
                document.body.classList.toggle("hud-hidden", !state.hudVisible);
                btnToggleHud.textContent = state.hudVisible ? "Hide Controls" : "Show Controls";
            });

            sliderSpeed.addEventListener("input", (e) => {
                state.speedMult = parseFloat(e.target.value);
            });

            sliderWind.addEventListener("input", (e) => {
                state.windMult = parseFloat(e.target.value);
            });

            function getLogicalMouseX(clientX) {
                const rect = canvas.getBoundingClientRect();
                return ((clientX - rect.left) / Math.max(1, rect.width)) * LOGICAL_W;
            }

            canvas.addEventListener("pointerdown", (e) => {
                state.dragging = true;
                state.dragStartX = getLogicalMouseX(e.clientX);
                state.dragStartDist = state.travelDist;
                canvas.setPointerCapture(e.pointerId);
            });

            canvas.addEventListener("pointermove", (e) => {
                if (!state.dragging) return;
                const currX = getLogicalMouseX(e.clientX);
                const dx = currX - state.dragStartX;
                state.travelDist = state.dragStartDist + dx;
            });

            canvas.addEventListener("pointerup", () => {
                state.dragging = false;
            });

            canvas.addEventListener("pointercancel", () => {
                state.dragging = false;
            });

            let lastTime = performance.now();
            let animFrameId = null;

            function tick(now) {
                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;

                state.windTime += dt;

                if (state.playing && !state.dragging) {
                    const dx = 45.0 * state.speedMult * dt;
                    state.travelDist += dx;
                }

                updateStageButtonLabel();
                updateAudio(state.windTime);
                renderScene(dt, state.windTime);

                animFrameId = requestAnimationFrame(tick);
            }

            window.onload = function () {
                if (animFrameId) cancelAnimationFrame(animFrameId);
                lastTime = performance.now();
                animFrameId = requestAnimationFrame(tick);
            };
        })();
    </script>
</body>

</html>
