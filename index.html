<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rural Bengal Bullock Cart &amp; Sauropod Dinosaur — Living Canvas Animation</title>
    <style>
        :root {
            --bg-dark: #0f1317;
            --panel-bg: rgba(15, 20, 26, 0.86);
            --panel-border: rgba(255, 255, 255, 0.16);
            --accent: #68b645;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #app-layout {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1b2228 0%, #0b0e11 100%);
            gap: 10px;
            padding: 8px 0;
        }

        body.fill-screen #app-layout {
            padding: 0;
            gap: 0;
        }

        #stage-wrapper {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #scene-canvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100vw;
            max-height: calc(100vh - 58px);
            aspect-ratio: 1000 / 411;
            object-fit: contain;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            cursor: grab;
        }

        #scene-canvas:active {
            cursor: grabbing;
        }

        body.hud-hidden #scene-canvas {
            max-height: 100vh;
        }

        body.fill-screen #scene-canvas {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            object-fit: cover;
            box-shadow: none;
        }

        #top-bar {
            position: fixed;
            top: 10px;
            left: 12px;
            right: 12px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        #status-badge {
            font-size: 11px;
            font-weight: 500;
            color: #e2e8f0;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: opacity 0.25s ease;
        }

        body.hud-hidden #status-badge {
            opacity: 0;
        }

        #btn-toggle-hud {
            pointer-events: auto;
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        #hud-bar {
            z-index: 25;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: calc(100vw - 20px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        body.fill-screen #hud-bar {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        body.hud-hidden #hud-bar {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .hud-btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.09);
            color: var(--text-main);
            font-size: 11.5px;
            font-weight: 600;
            padding: 5px 11px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.15s ease, border-color 0.15s ease;
            white-space: nowrap;
        }

        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.32);
        }

        .hud-btn.active {
            background: rgba(104, 182, 69, 0.28);
            border-color: var(--accent);
            color: #d9f99d;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-left: 8px;
            border-left: 1px solid rgba(255, 255, 255, 0.14);
        }

        .hud-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }

        .hud-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 68px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.24);
            outline: none;
            cursor: pointer;
        }

        .hud-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #ffffff;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            #status-badge {
                display: none;
            }

            #hud-bar {
                border-radius: 14px;
                padding: 6px 8px;
                gap: 5px;
            }

            .hud-slider {
                width: 50px;
            }
        }
    </style>
</head>

<body>
    <div id="top-bar">
        <div id="status-badge">Sequential Procession: Cow Cart → Dinosaur → 2 Dragons → Godzilla • Drag canvas to scrub
        </div>
        <button id="btn-toggle-hud" class="hud-btn" type="button" title="Toggle Controls">Hide Controls</button>
    </div>

    <div id="app-layout">
        <div id="stage-wrapper">
            <canvas id="scene-canvas" width="2000" height="822"
                aria-label="Animated rural bullock cart followed by a realistic sauropod dinosaur in an alternating procession"></canvas>
        </div>

        <div id="hud-bar">
            <button id="btn-play" class="hud-btn active" type="button">Pause</button>
            <button id="btn-reset" class="hud-btn" type="button">Reset Position</button>
            <button id="btn-next-stage" class="hud-btn" type="button"
                title="Jump to next creature in sequence (Cow Cart → Dinosaur → 2 Dragons → Godzilla)">Next:
                Dinosaur</button>
            <button id="btn-roar" class="hud-btn" type="button"
                title="Trigger the active animal's realistic roar/call animation and sound">Moo: Cow Cart</button>

            <div class="hud-group">
                <span class="hud-label">Cart Speed</span>
                <input id="slider-speed" class="hud-slider" type="range" min="0" max="2.5" step="0.05" value="1.0" />
            </div>

            <div class="hud-group">
                <span class="hud-label">Breeze</span>
                <input id="slider-wind" class="hud-slider" type="range" min="0.1" max="2.5" step="0.05" value="1.0" />
            </div>

            <div class="hud-group">
                <button id="btn-mode" class="hud-btn" type="button"
                    title="Switch between Photorealistic Living Hybrid and 100% Pure Procedural Canvas Drawing">Mode:
                    Photorealistic</button>
                <button id="btn-fit" class="hud-btn" type="button"
                    title="Toggle original aspect ratio vs full viewport">Fit: Aspect</button>
                <button id="btn-audio" class="hud-btn" type="button"
                    title="Toggle synthesized rural wind, wooden cart, and sauropod footstep soundscape">Sound:
                    Off</button>
            </div>
        </div>
    </div>

            function mulberry32(seed) {
                return function () {
                    let t = (seed += 0x6d2b79f5);
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

            for (let x = 0; x < LOGICAL_W; x += 2.5) {
                let hTop = 315.5 + Math.sin(x * 0.05) * 2.2 + (rand() - 0.5) * 2.8;
                if (x >= 645 && x < 820) {

                } else if (x >= 820) {

                    hTop = 308 - groveEnvelope + (rand() - 0.5) * 5.5;
                }
                horizonTrees.push({
                    x,
                    topY: hTop,
                    baseY: 333,
                    w: 2.8 + rand() * 3.2,
                    isTallRight: x >= 760,
                    colMist: `rgba(${136 + Math.floor(rand() * 12)}, ${154 + Math.floor(rand() * 12)}, ${170 + Math.floor(rand() * 12)}, 0.85)`,
                    colDense: `rgba(${92 + Math.floor(rand() * 20)}, ${108 + Math.floor(rand() * 20)}, ${122 + Math.floor(rand() * 18)}, 0.78)`
                });
            }

            const saplings = [
                {
                    baseX: 461,
                    baseY: 336.5,
                    height: 44.5,
                    color: "rgba(68, 76, 62, 0.85)",
                    twigs: [
                        { yFrac: 0.55, dx: -3.2, dy: -4.2 },

            const soilClods = [];
            for (let i = 0; i < 650; i++) {
                const sx = rand() * LOGICAL_W;

            // -------------------------------------------------------------------------
            // 1. REAL-WORLD ZEBU CATTLE BIOMECHANICS & SPOKED WOODEN WHEEL RENDERING
            // -------------------------------------------------------------------------
            function getRealWorldLegKinematics(hipX, hipY, baseGroundY, phase, isHind) {
                const p = ((phase % 1.0) + 1.0) % 1.0;
                const stanceRatio = 0.64;

                if (isHind) {
                    const dxFront = 14.5;
                    const dxBack = -12.0;
                    const hockFront = 3.2;
                    const hockBack = -11.4;

                    if (p < stanceRatio) {
                        const t = p / stanceRatio;
                        const hoofX = hipX + dxFront + (dxBack - dxFront) * t;
                        const groundY = baseGroundY + getRoadBumpY(hoofX);
                        const kneeX = hipX + hockFront + (hockBack - hockFront) * t;
                        const kneeY = hipY + (groundY - hipY) * 0.53;
                        return { kneeX, kneeY, hoofX, hoofY: groundY };
                    } else {
                        const t = (p - stanceRatio) / (1.0 - stanceRatio);
                        const st = t * t * (3 - 2 * t);
                        const lag = Math.sin(t * Math.PI) * 2.8;
                        const hoofX = hipX + dxBack + (dxFront - dxBack) * st - lag;
                        const groundY = baseGroundY + getRoadBumpY(hoofX);
                        const hoofY = groundY - Math.sin(t * Math.PI) * 4.4;
                        const kneeX = hipX + hockBack + (hockFront - hockBack) * st;
                        const kneeY = hipY + (groundY - hipY) * 0.53 - Math.sin(t * Math.PI) * 2.2;
                        return { kneeX, kneeY, hoofX, hoofY };
                    }
                } else {
                    const dxFront = 10.5;
                    const dxBack = -16.5;

                    if (p < stanceRatio) {
                        const t = p / stanceRatio;
                        const hoofX = hipX + dxFront + (dxBack - dxFront) * t;
                        const groundY = baseGroundY + getRoadBumpY(hoofX);
                        const kneeX = hipX + (hoofX - hipX) * 0.50 + 0.5;
                        const kneeY = hipY + (groundY - hipY) * 0.52;
                        return { kneeX, kneeY, hoofX, hoofY: groundY };
                    } else {
                        const t = (p - stanceRatio) / (1.0 - stanceRatio);
                        const st = t * t * (3 - 2 * t);
                        const hoofLag = Math.sin(t * Math.PI) * 5.6;
                        const hoofX = hipX + dxBack + (dxFront - dxBack) * st - hoofLag;
                        const groundY = baseGroundY + getRoadBumpY(hoofX);
                        const hoofY = groundY - Math.sin(t * Math.PI) * 5.0;
                        const kneeDx = dxBack * 0.50 + (dxFront * 0.55 - dxBack * 0.50) * st + Math.sin(t * Math.PI) * 2.4;
                        const kneeX = hipX + kneeDx;
                        const kneeY = hipY + (groundY - hipY) * 0.50 - Math.sin(t * Math.PI) * 2.5;
                        return { kneeX, kneeY, hoofX, hoofY };
                    }
                }
            }

            function drawAnatomicalCowLeg(hipX, hipY, phase, isHind, isNear, usePhoto) {
                const baseGroundY = isNear ? 342.8 : 341.6;
                const { kneeX, kneeY, hoofX, hoofY } = getRealWorldLegKinematics(hipX, hipY, baseGroundY, phase, isHind);

                // In Photorealistic Mode, render 1x photographic hide-textured limb sprites (zero plastic vector polygons!)
                if (usePhoto && images.cowLimbs.complete) {
                    // 2x Retina Sprite sheet layout (8 cols x 48px width, 72px height -> 24x36 logical):
                    // Near: Col 0 = Hind Upper, Col 1 = Hind Lower, Col 2 = Front Upper, Col 3 = Front Lower
                    // Far:  Col 4 = Hind Upper, Col 5 = Hind Lower, Col 6 = Front Upper, Col 7 = Front Lower
                    const baseCol = (isNear ? 0 : 4) + (isHind ? 0 : 2);
                    const sxUpper = baseCol * 48;
                    const sxLower = (baseCol + 1) * 48;

                    // A. Upper Thigh / Forearm Sprite (Hip/Shoulder -> Hock/Knee)
                    const dxU = kneeX - hipX;
                    const dyU = kneeY - hipY;
                    const lenU = Math.hypot(dxU, dyU);
                    const angU = Math.atan2(dyU, dxU) - Math.PI * 0.5;
                    const refLenU = isHind ? 20.0 : 18.0;
                    const scaleU = lenU / refLenU;

                    ctx.save();
                    ctx.translate(hipX, hipY);
                    ctx.rotate(angU);
                    ctx.drawImage(
                        images.cowLimbs,
                        sxUpper, 0, 48, 72,
                        -12.0, -5.0 * scaleU, 24, 36 * scaleU
                    );
                    ctx.restore();

                    // B. Lower Cannon Bone + Fetlock + Hoof Sprite (Hock/Knee -> Hoof)
                    const dxL = hoofX - kneeX;
                    const dyL = hoofY - kneeY;
                    const lenL = Math.hypot(dxL, dyL);
                    const angL = Math.atan2(dyL, dxL) - Math.PI * 0.5;
                    const refLenL = 20.5;
                    const scaleL = lenL / refLenL;

                    ctx.save();
                    ctx.translate(kneeX, kneeY);
                    ctx.rotate(angL);
                    ctx.drawImage(
                        images.cowLimbs,
                        sxLower, 0, 48, 72,
                        -12.0, -5.0 * scaleL, 24, 36 * scaleL
                    );
                    ctx.restore();
                    return;
                }

                const fetX = hoofX - 0.35;
                const fetY = hoofY - 2.8;

                const wTopBack = isHind ? 6.0 : 5.0;
                const wTopFront = isHind ? 5.2 : 5.2;
                const wKneeBack = isHind ? 2.7 : 2.1;
                const wKneeFront = isHind ? 2.0 : 2.2;
                const wFet = 1.85;

                ctx.save();

                const upperGrad = ctx.createLinearGradient(hipX - wTopBack, hipY, hipX + wTopFront, hipY);
                if (isNear) {
                    upperGrad.addColorStop(0.0, "rgb(86, 54, 40)");
                    upperGrad.addColorStop(0.38, "rgb(128, 104, 92)");
                    upperGrad.addColorStop(0.72, "rgb(152, 136, 128)");
                    upperGrad.addColorStop(1.0, "rgb(172, 160, 154)");
                } else {
                    upperGrad.addColorStop(0.0, "rgb(62, 40, 30)");
                    upperGrad.addColorStop(0.45, "rgb(98, 78, 68)");
                    upperGrad.addColorStop(1.0, "rgb(126, 110, 100)");
                }

                ctx.fillStyle = upperGrad;
                ctx.beginPath();
                ctx.moveTo(hipX - wTopBack, hipY + (0));
                ctx.quadraticCurveTo(hipX, hipY - (0), hipX + wTopFront, hipY + (0));
                ctx.quadraticCurveTo(
                    (hipX + kneeX) * 0.5 + wTopFront * 0.52,
                    (hipY + kneeY) * 0.5,
                    kneeX + wKneeFront,
                    kneeY
                );
                ctx.lineTo(kneeX - wKneeBack, kneeY);
                ctx.quadraticCurveTo(
                    (hipX + kneeX) * 0.5 - wTopBack * 0.62,
                    (hipY + kneeY) * 0.5,
                    hipX - wTopBack,
                    hipY + (0)
                );
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(
                    kneeX - (wKneeBack - wKneeFront) * 0.25,
                    kneeY,
                    (wKneeBack + wKneeFront) * 0.52,
                    2.3,
                    0,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                const lowerGrad = ctx.createLinearGradient(kneeX - 3, kneeY, hoofX + 3, fetY);
                if (isNear) {
                    lowerGrad.addColorStop(0.0, "rgb(88, 58, 44)");
                    lowerGrad.addColorStop(0.55, "rgb(142, 124, 114)");
                    lowerGrad.addColorStop(1.0, "rgb(168, 154, 146)");
                } else {
                    lowerGrad.addColorStop(0.0, "rgb(64, 42, 32)");
                    lowerGrad.addColorStop(0.55, "rgb(102, 82, 72)");
                    lowerGrad.addColorStop(1.0, "rgb(124, 108, 98)");
                }

                ctx.fillStyle = lowerGrad;
                ctx.beginPath();
                ctx.moveTo(kneeX - wKneeBack * 0.84, kneeY);
                ctx.lineTo(kneeX + wKneeFront * 0.90, kneeY);
                ctx.lineTo(fetX + wFet, fetY);
                ctx.lineTo(fetX - wFet, fetY);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = isNear ? "rgba(68, 40, 28, 0.62)" : "rgba(48, 30, 22, 0.65)";
                ctx.lineWidth = 1.15;
                ctx.beginPath();
                ctx.moveTo(hipX - wTopBack + 0.8, hipY + 3);
                ctx.lineTo(kneeX - wKneeBack + 0.4, kneeY);
                ctx.lineTo(fetX - wFet + 0.4, fetY);
                ctx.stroke();

                ctx.strokeStyle = isNear ? "rgba(184, 174, 168, 0.65)" : "rgba(138, 122, 114, 0.5)";
                ctx.lineWidth = 1.0;
                ctx.beginPath();
                ctx.moveTo(hipX + wTopFront - 0.6, hipY + 3);
                ctx.lineTo(kneeX + wKneeFront - 0.4, kneeY);
                ctx.lineTo(fetX + wFet - 0.4, fetY);
                ctx.stroke();

                ctx.fillStyle = isNear ? "rgba(86, 62, 46, 0.94)" : "rgba(66, 48, 36, 0.92)";
                ctx.beginPath();
                ctx.moveTo(fetX - wFet, fetY);
                ctx.lineTo(fetX + wFet + 0.2, fetY);
                ctx.lineTo(hoofX + 2.6, hoofY);
                ctx.lineTo(hoofX - 2.2, hoofY);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            function drawWoodenWheel(cx, cy, radius, angle, isNear) {
                ctx.save();
                ctx.translate(cx, cy);

                if (isNear) {
                    const shGrad = ctx.createRadialGradient(0, radius + 0.5, 1, 0, radius + 0.5, 18);
                    shGrad.addColorStop(0, "rgba(24, 18, 12, 0.58)");
                    shGrad.addColorStop(1, "rgba(24, 18, 12, 0)");
                    ctx.fillStyle = shGrad;
                    ctx.beginPath();
                    ctx.ellipse(0, radius + 0.5, 18, 2.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.rotate(angle);

                if (state.renderMode === "photorealistic" && assetsReady && images.cartUpper.complete) {
                    if (!isNear) {
                        ctx.globalAlpha = 0.82;
                    }
                    ctx.drawImage(
                        images.cartUpper,
                        564, 0, 156, 156,
                        -radius, -radius, radius * 2, radius * 2
                    );
                    ctx.restore();
                    return;
                }

                const felloeOuter = radius - 0.8;
                const felloeInner = radius - 5.6;
                const hubRadius = 7.4;

                const numSpokes = 12;
                for (let i = 0; i < numSpokes; i++) {
                    const a = (i * Math.PI * 2) / numSpokes;
                    ctx.save();
                    ctx.rotate(a);

                    ctx.fillStyle = isNear ? "rgb(98, 84, 75)" : "rgb(68, 56, 48)";
                    ctx.beginPath();
                    ctx.moveTo(hubRadius - 1, -1.55);
                    ctx.lineTo(felloeInner + 0.8, -1.05);
                    ctx.lineTo(felloeInner + 0.8, 1.05);
                    ctx.lineTo(hubRadius - 1, 1.55);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = isNear ? "rgba(136, 122, 112, 0.75)" : "rgba(92, 78, 68, 0.6)";
                    ctx.lineWidth = 0.65;
                    ctx.beginPath();
                    ctx.moveTo(hubRadius, -1.1);
                    ctx.lineTo(felloeInner, -0.8);
                    ctx.stroke();

                    ctx.strokeStyle = isNear ? "rgba(44, 32, 24, 0.8)" : "rgba(32, 22, 18, 0.8)";
                    ctx.lineWidth = 0.75;
                    ctx.beginPath();
                    ctx.moveTo(hubRadius, 1.2);
                    ctx.lineTo(felloeInner, 0.9);
                    ctx.stroke();

                    ctx.restore();
                }

                ctx.strokeStyle = isNear ? "rgb(104, 90, 81)" : "rgb(74, 62, 54)";
                ctx.lineWidth = felloeOuter - felloeInner;
                ctx.beginPath();
                ctx.arc(0, 0, (felloeOuter + felloeInner) * 0.5, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = isNear ? "rgba(52, 40, 32, 0.65)" : "rgba(38, 28, 22, 0.65)";
                ctx.lineWidth = 0.8;
                for (let j = 0; j < 6; j++) {
                    const ja = (j * Math.PI) / 3 + 0.15;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(ja) * felloeInner, Math.sin(ja) * felloeInner);
                    ctx.lineTo(Math.cos(ja) * felloeOuter, Math.sin(ja) * felloeOuter);
                    ctx.stroke();
                }

                ctx.strokeStyle = isNear ? "rgba(48, 36, 28, 0.82)" : "rgba(34, 24, 18, 0.85)";
                ctx.lineWidth = 1.0;
                ctx.beginPath();
                ctx.arc(0, 0, felloeInner, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = isNear ? "rgb(46, 36, 30)" : "rgb(36, 28, 22)";
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                ctx.arc(0, 0, radius - 0.4, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = isNear ? "rgb(66, 52, 44)" : "rgb(48, 38, 32)";
                ctx.beginPath();
                ctx.arc(0, 0, hubRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "rgb(36, 26, 20)";
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.arc(0, 0, hubRadius - 0.5, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = isNear ? "rgb(112, 98, 90)" : "rgb(78, 66, 58)";
                ctx.beginPath();
                ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "rgb(38, 28, 22)";
                ctx.beginPath();
                ctx.arc(0, 0, 1.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // -------------------------------------------------------------------------
            // 2. REAL-WORLD SAUROPOD DINOSAUR BIOMECHANICS, 3-JOINT LIMBS & FOOTSTEPS
            // -------------------------------------------------------------------------
            function getSauropodLegKinematics(hipX, hipY, baseGroundY, phase, isHind) {
                const p = ((phase % 1.0) + 1.0) % 1.0;
                const stanceRatio = 0.65;

                if (isHind) {
                    const dxFront = 18.0;
                    const dxBack = -36.0;

                    if (p < stanceRatio) {
                        const t = p / stanceRatio;
                        const footX = hipX + dxFront + (dxBack - dxFront) * t;
                        const groundY = baseGroundY + getRoadBumpY(footX);
                        const kneeBend = -3.8 * Math.sin(t * Math.PI);
                        const kneeX = hipX + (footX - hipX) * 0.46 + kneeBend;
                        const kneeY = hipY + (groundY - hipY) * 0.47;
                        const footTilt = t > 0.84 ? ((t - 0.84) / 0.16) * 0.34 : 0.0;
                        const weightSquash = Math.sin(t * Math.PI) * 0.09;
                        const impactProg = t < 0.28 ? t / 0.28 : -1.0;
                        return { kneeX, kneeY, footX, footY: groundY, footTilt, weightSquash, impactProg };
                    } else {
                        const t = (p - stanceRatio) / (1.0 - stanceRatio);
                        const st = t * t * (3 - 2 * t);
                        const lag = Math.sin(t * Math.PI) * 4.8;
                        const footX = hipX + dxBack + (dxFront - dxBack) * st - lag;
                        const groundY = baseGroundY + getRoadBumpY(footX);
                        const lift = Math.sin(t * Math.PI) * 7.8;
                        const footY = groundY - lift;
                        const kneeX = hipX + (footX - hipX) * 0.48 + Math.sin(t * Math.PI) * 3.5;
                        const kneeY = hipY + (groundY - hipY) * 0.45 - lift * 0.45;
                        const footTilt = Math.sin(Math.pow(t, 0.75) * Math.PI) * 0.46 * (1.0 - t * 0.55);
                        return { kneeX, kneeY, footX, footY, footTilt, weightSquash: 0.0, impactProg: -1.0 };
                    }
                } else {
                    const dxFront = 24.0;
                    const dxBack = -24.0;

                    if (p < stanceRatio) {
                        const t = p / stanceRatio;
                        const footX = hipX + dxFront + (dxBack - dxFront) * t;
                        const groundY = baseGroundY + getRoadBumpY(footX);
                        const kneeX = hipX + (footX - hipX) * 0.45 - 2.0 * Math.sin(t * Math.PI);
                        const kneeY = hipY + (groundY - hipY) * 0.46;
                        const footTilt = t > 0.82 ? ((t - 0.82) / 0.18) * 0.42 : 0.0;
                        const weightSquash = Math.sin(t * Math.PI) * 0.08;
                        const impactProg = t < 0.28 ? t / 0.28 : -1.0;
                        return { kneeX, kneeY, footX, footY: groundY, footTilt, weightSquash, impactProg };
                    } else {
                        const t = (p - stanceRatio) / (1.0 - stanceRatio);
                        const st = t * t * (3 - 2 * t);
                        const lag = Math.sin(t * Math.PI) * 6.0;
                        const footX = hipX + dxBack + (dxFront - dxBack) * st - lag;
                        const groundY = baseGroundY + getRoadBumpY(footX);
                        const lift = Math.sin(t * Math.PI) * 8.5;
                        const footY = groundY - lift;
                        const kneeX = hipX + (footX - hipX) * 0.43 - Math.sin(t * Math.PI) * 2.2;
                        const kneeY = hipY + (groundY - hipY) * 0.44 - lift * 0.42;
                        const footTilt = Math.sin(Math.pow(t, 0.7) * Math.PI) * 0.56 * (1.0 - t * 0.5);
                        return { kneeX, kneeY, footX, footY, footTilt, weightSquash: 0.0, impactProg: -1.0 };
                    }
                }
            }

            // Renders compressed dirt footprint tracks left behind on the embankment by the dinosaur's massive feet
            function drawDinoFootprintTracks(dinoX) {
                const stepSpacing = 27.0;
                const maxTrackX = 325 + dinoX;
                const minTrackX = Math.max(-20, maxTrackX - 280);
                const startIdx = Math.floor(minTrackX / stepSpacing);
                const endIdx = Math.floor(maxTrackX / stepSpacing);

                for (let idx = startIdx; idx <= endIdx; idx++) {
                    const fx = idx * stepSpacing + ((idx % 2) * 4.5);
                    if (fx < -15 || fx > LOGICAL_W + 15 || fx > maxTrackX) continue;
                    const distBehind = maxTrackX - fx;
                    const fade = Math.max(0, Math.min(1, 1.0 - distBehind / 270.0));
                    const fy = 340.6 + getRoadBumpY(fx) + ((idx % 2) * 0.8);

                    ctx.fillStyle = `rgba(146, 128, 102, ${(0.38 * fade).toFixed(3)})`;
                    ctx.beginPath();
                    ctx.ellipse(fx, fy + 0.3, 12.5, 2.3, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = `rgba(42, 32, 22, ${(0.46 * fade).toFixed(3)})`;
                    ctx.beginPath();
                    ctx.ellipse(fx + 0.5, fy, 10.2, 1.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Renders billowing dust shockwaves and flying soil clods/pebbles when a massive sauropod foot impacts the dirt
            function drawDinoFootstepImpact(footX, groundY, impactProg, isNear) {
                if (impactProg < 0 || impactProg > 1) return;
                const env = Math.sin(impactProg * Math.PI);
                const spread = 6.0 + impactProg * 22.0;

                ctx.save();
                const dustAlpha = env * (isNear ? 0.38 : 0.25);
                for (let side = -1; side <= 1; side += 2) {
                    const px = footX + side * spread - impactProg * 6.0 * state.windMult;
                    const py = groundY - 1.5 - impactProg * 4.5;
                    const pr = 4.5 + impactProg * 8.5;
                    const dGrad = ctx.createRadialGradient(px, py, 0.5, px, py, pr);
                    dGrad.addColorStop(0, `rgba(156, 140, 118, ${dustAlpha.toFixed(3)})`);
                    dGrad.addColorStop(0.6, `rgba(138, 122, 100, ${(dustAlpha * 0.55).toFixed(3)})`);
                    dGrad.addColorStop(1, "rgba(138, 122, 100, 0)");
                    ctx.fillStyle = dGrad;
                    ctx.beginPath();
                    ctx.ellipse(px, py, pr * 1.35, pr * 0.75, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                const clodOffsets = [-11, -6, -2, 4, 9, 13];
                for (let c = 0; c < clodOffsets.length; c++) {
                    const vx = clodOffsets[c] * 1.35;
                    const vy0 = 14.0 + (c % 3) * 5.5;
                    const cx = footX + vx * impactProg;
                    const cy = groundY - Math.max(0, vy0 * impactProg * (1.0 - impactProg) * 1.8);
                    const cAlpha = (1.0 - impactProg * 0.85) * (isNear ? 0.78 : 0.55);
                    ctx.fillStyle = c % 2 === 0
                        ? `rgba(74, 58, 40, ${cAlpha.toFixed(2)})`
                        : `rgba(116, 98, 74, ${cAlpha.toFixed(2)})`;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 0.85 + (c % 2) * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // Renders a single 3-joint articulated Sauropod Leg (Upper Thigh/Arm -> Lower Shin/Forearm -> Independent Flat 3-Toed Cushion Foot)
            function drawSauropodLeg(hipX, hipY, phase, isHind, isNear, usePhoto, isMoving) {
                const baseGroundY = isNear ? 340.8 : 339.6;
                const { kneeX, kneeY, footX, footY, footTilt, weightSquash, impactProg } = getSauropodLegKinematics(
                    hipX, hipY, baseGroundY, phase, isHind
                );

                const ankleX = footX - Math.sin(footTilt) * 9.5;
                const ankleY = footY - 11.5 * Math.cos(footTilt);

                ctx.save();

                const groundAtFoot = baseGroundY + getRoadBumpY(footX);

                ctx.beginPath();
                ctx.ellipse(footX + 2, groundAtFoot + 0.8, shadowRx, 3.2, 0, 0, Math.PI * 2);

                    const sxLower = (baseCol + 1) * 48;
                    const sxFoot = (baseCol + 2) * 48;

                    const dxU = kneeX - hipX;
                    const dyU = kneeY - hipY;
                    const lenU = Math.hypot(dxU, dyU);
                    const angU = Math.atan2(dyU, dxU) - Math.PI * 0.5;
                    const refLenU = isHind ? 36.0 : 31.0;
                    const scaleU = lenU / refLenU;
                    const pivotUx = isHind ? 22.0 : 19.0;

                    ctx.save();
                    ctx.translate(hipX, hipY);
                    ctx.rotate(angU);
                    ctx.drawImage(images.dinoLimbs, sxUpper, 0, 48, 60, -pivotUx, -12.0 * scaleU, 48, 60 * scaleU);
                    ctx.restore();

                    const dxL = ankleX - kneeX;
                    const dyL = ankleY - kneeY;
                    const lenL = Math.hypot(dxL, dyL);
                    const angL = Math.atan2(dyL, dxL) - Math.PI * 0.5;
                    const refLenL = isHind ? 33.0 : 32.0;
                    const scaleL = lenL / refLenL;

                    ctx.save();
                    ctx.translate(kneeX, kneeY);
                    ctx.rotate(angL);
                    ctx.drawImage(images.dinoLimbs, sxLower, 0, 48, 60, -22.0, -7.5 * scaleL, 48, 60 * scaleL);
                    ctx.restore();

                    const squashY = 1.0 - weightSquash;
                    const spreadX = 1.0 + weightSquash * 0.75;
                    ctx.save();
                    ctx.translate(ankleX, ankleY);
                    ctx.rotate(footTilt);
                    ctx.scale(spreadX, squashY);
                    ctx.drawImage(images.dinoLimbs, sxFoot, 0, 48, 24, -22.0, -6.0, 48, 24);
                    ctx.restore();

                    if (isMoving && impactProg >= 0) {
                        drawDinoFootstepImpact(footX, groundAtFoot, impactProg, isNear);
                    }

                    ctx.restore();
                    return;
                }

                const wTopBack = isHind ? 16.5 : 12.5;
                const wTopFront = isHind ? 15.0 : 12.0;
                const wKneeBack = isHind ? 9.8 : 7.5;
                const wKneeFront = isHind ? 9.2 : 7.2;
                const wAnkleBack = isHind ? 7.6 : 6.0;
                const wAnkleFront = isHind ? 7.2 : 5.8;

                const skinGrad = ctx.createLinearGradient(hipX - wTopBack, hipY, kneeX + wKneeFront, kneeY);

                ctx.fillStyle = skinGrad;
                ctx.beginPath();
                ctx.moveTo(hipX - wTopBack, hipY);
                ctx.lineTo(hipX + wTopFront, hipY);
                ctx.lineTo(kneeX + wKneeFront, kneeY);
                ctx.lineTo(kneeX - wKneeBack, kneeY);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(kneeX - wKneeBack, kneeY);

                ctx.restore();

                if (isMoving && impactProg >= 0) {

            // -------------------------------------------------------------------------

            const roarState = {
                cowTimer: 0,

            function getRoarEnvelope(timer, dur, attackFrac, sustainEndFrac) {
                if (timer <= 0 || timer >= dur) return 0.0;
                const p = timer / dur;
                if (p < attackFrac) {
                    const u = p / attackFrac;
                    return u * u * (3.0 - 2.0 * u);
                } else if (p < sustainEndFrac) {
                    return 1.0;
                } else {
                    const u = (p - sustainEndFrac) / (1.0 - sustainEndFrac);
                    return 1.0 - u * u * (3.0 - 2.0 * u);
                }
            }

            function drawProceduralDinoUpper(dinoX, dinoBobY, dinoPhase, roarAmt, t) {
                ctx.save();
                ctx.translate(dinoX, dinoBobY);

                const bodyGrad = ctx.createLinearGradient(290, 182, 370, 272);
                bodyGrad.addColorStop(0.0, "rgb(134, 124, 115)");
                bodyGrad.addColorStop(0.45, "rgb(104, 92, 82)");

                bodyGrad.addColorStop(1.0, "rgb(46, 38, 32)");

                const tailTipY = 274 + Math.sin(dinoPhase * Math.PI * 4 - 2.5) * 4.5;
                const headSwayY = Math.sin(dinoPhase * Math.PI * 4 - 1.2) * 3.5 - roarAmt * 22.0;
                const jawOpen = roarAmt * 6.5;

                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(34, tailTipY);
                ctx.quadraticCurveTo(155, 236, 265, 200);
                ctx.quadraticCurveTo(335, 174, 395, 194);
                ctx.quadraticCurveTo(455, 198, 505, 148 + headSwayY * 0.6);
                ctx.quadraticCurveTo(536, 119 + headSwayY, 562, 122 + headSwayY);
                ctx.lineTo(576, 131 + headSwayY - roarAmt * 2.5);
                ctx.quadraticCurveTo(575, 137 + headSwayY + jawOpen, 566, 136 + headSwayY + jawOpen);
                ctx.quadraticCurveTo(552, 134 + headSwayY + jawOpen * 0.7, 540, 136 + headSwayY + roarAmt * 3.5);
                ctx.quadraticCurveTo(510, 162 + headSwayY * 0.5, 472, 212);
                ctx.quadraticCurveTo(442, 244, 412, 258);
                ctx.quadraticCurveTo(360, 274, 290, 262);
                ctx.quadraticCurveTo(255, 250, 165, 252);
                ctx.quadraticCurveTo(95, 258, 34, tailTipY);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = "rgba(44, 36, 28, 0.65)";
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(335, 212);
                ctx.quadraticCurveTo(338, 256, 378, 248);
                ctx.stroke();

                ctx.fillStyle = "rgb(32, 26, 22)";
                ctx.beginPath();
                ctx.arc(561, 126 + headSwayY, 1.3, 0, Math.PI * 2);

            function renderDinosaurInstance(dinoX, dinoPhase, t, usePhoto) {
                if (585 + dinoX < -20 || 30 + dinoX > LOGICAL_W + 20) return;

                const isMoving = state.playing && state.speedMult > 0.01;
                const strideScale = isMoving ? 1.0 : 0.0;
                const groundBump = getRoadBumpY(350 + dinoX);
                const roarAmt = getRoarEnvelope(roarState.dinoTimer, roarState.dinoDur, 0.18, 0.76);
                const vib = roarAmt > 0.05 ? Math.sin(t * 42.0) * 0.75 * roarAmt : 0.0;

                const stepFrac = ((dinoPhase * 4.0) % 1.0 + 1.0) % 1.0;
                const impactTremor = isMoving && stepFrac < 0.22
                    ? Math.exp(-stepFrac * 18.0) * Math.sin(stepFrac * 85.0) * 0.95
                    : 0.0;
                const dinoBobY = groundBump * 0.9 + Math.sin(dinoPhase * Math.PI * 4) * 1.45 * strideScale + impactTremor;

                // 0. Persistent Compressed Dirt Footprint Tracks trailed behind the dinosaur on the embankment!
                drawDinoFootprintTracks(dinoX);

                const bodyShGrad = ctx.createRadialGradient(
                    345 + dinoX, 340.2, 8,
                    345 + dinoX, 340.2, 96
                );
                bodyShGrad.addColorStop(0, "rgba(24, 18, 12, 0.45)");
                bodyShGrad.addColorStop(1, "rgba(24, 18, 12, 0)");
                ctx.fillStyle = bodyShGrad;
                ctx.beginPath();
                ctx.ellipse(345 + dinoX, 340.2, 96, 4.2, 0, 0, Math.PI * 2);
                ctx.fill();

                // 1. Far-side (Left) Legs: Far Hind Leg (+0.52) & Far Front Leg (+0.27)
                drawSauropodLeg(298 + dinoX, 253 + dinoBobY, dinoPhase + 0.52, true, false, usePhoto, isMoving);
                drawSauropodLeg(374 + dinoX, 255 + dinoBobY, dinoPhase + 0.27, false, false, usePhoto, isMoving);

                // 2. Near-side (Right) Legs: Near Hind Leg (+0.02) & Near Front Leg (+0.77)
                drawSauropodLeg(317 + dinoX, 251 + dinoBobY, dinoPhase + 0.02, true, true, usePhoto, isMoving);
                drawSauropodLeg(398 + dinoX, 252 + dinoBobY, dinoPhase + 0.77, false, true, usePhoto, isMoving);

                // 3. Dinosaur Upper Body, Undulating Tail, and Gently Swaying / Roar-Arching Long Neck & Head
                if (usePhoto) {
                    const stripW = 6;
                    const totalW = 548;
                    let mouthWorldX = 32 + 542 + dinoX;
                    let mouthWorldY = 118 + dinoBobY + 14;

                    for (let lx = 0; lx < totalW; lx += stripW) {
                        const wSlice = Math.min(stripW, totalW - lx);
                        let waveY = 0;
                        let stretchH = 157;
                        if (lx < 235) {
                            const tailFrac = (235 - lx) / 235;
                            waveY = Math.sin(dinoPhase * Math.PI * 4 - tailFrac * 2.6) * 4.2 * (tailFrac * tailFrac) * strideScale;
                        } else if (lx > 385) {
                            const neckFrac = (lx - 385) / 163;
                            // During a Sauropod Bellow, the long neck arches high into the sky and vibrates with resonance!
                            const roarLift = -roarAmt * 25.0 * Math.pow(neckFrac, 1.38) + vib * neckFrac;
                            waveY = Math.sin(dinoPhase * Math.PI * 4 - 0.8 - neckFrac * 1.4) * 3.4 * Math.pow(neckFrac, 1.25) * strideScale + roarLift;
                            // Throat pouch inflation on the underside of the upper neck (lx = 475..520)
                            if (roarAmt > 0.01 && lx >= 475 && lx <= 522) {
                                const pouchSin = Math.sin(((lx - 475) / 47) * Math.PI);
                                stretchH = 157 + roarAmt * 4.5 * pouchSin;
                            }
                        }

                        if (roarAmt > 0.02 && lx >= 522) {
                            // Separate Upper Skull (y = 0..15) and Lower Jaw (y = 15..26) cleanly inside the head (x = 522..539)
                            const headProg = Math.min(1.0, (lx - 522) / 16);
                            const upperLift = -roarAmt * 2.4 * headProg;
                            const lowerDrop = roarAmt * 4.5 * headProg;

                            if (lx >= 526 && lx <= 534) {
                                ctx.fillStyle = `rgba(68, 28, 28, ${(0.82 * roarAmt).toFixed(2)})`;
                                ctx.beginPath();
                                ctx.ellipse(
                                    32 + lx + 2 + dinoX,
                                    118 + dinoBobY + waveY + 15 + (upperLift + lowerDrop) * 0.45,
                                    3.2, 2.2 * roarAmt, 0.1, 0, Math.PI * 2
                                );
                                ctx.fill();
                            }

                            // Upper skull/crest
                            ctx.drawImage(
                                images.dinoBody,
                                lx, 0, wSlice, 15,
                                32 + lx + dinoX, 118 + dinoBobY + waveY + upperLift, wSlice + 0.75, 15
                            );
                            // Hinged lower jaw
                            ctx.drawImage(
                                images.dinoBody,
                                lx, 14, wSlice, 143,
                                32 + lx + dinoX, 118 + dinoBobY + waveY + 14 + lowerDrop, wSlice + 0.75, 143
                            );
                            if (lx <= 538) {
                                mouthWorldX = 32 + 538 + dinoX;
                                mouthWorldY = 118 + dinoBobY + waveY + 14;
                            }
                        } else {
                            ctx.drawImage(
                                images.dinoBody,
                                lx, 0, wSlice, 157,
                                32 + lx + dinoX, 118 + dinoBobY + waveY, wSlice + 0.75, stretchH
                            );
                        }
                    }

                    // 4. Sauropod Bellow Breath Mist & Low-Frequency Acoustic Rings from Open Mouth
                    if (roarAmt > 0.04) {
                        ctx.save();
                        const pNorm = roarState.dinoTimer / roarState.dinoDur;
                        // Warm condensation vapor cloud puffing into the cool overcast sky
                        for (let i = 0; i < 6; i++) {
                            const puffAge = ((pNorm * 2.2 + i * 0.17) % 1.0);
                            const px = mouthWorldX + 6 + puffAge * 44;
                            const py = mouthWorldY - puffAge * 18 + Math.sin(t * 8 + i) * 2.5;
                            const rad = 4 + puffAge * 18;
                            const alpha = (1.0 - puffAge) * 0.55 * roarAmt;
                            const mGrad = ctx.createRadialGradient(px, py, 1, px, py, rad);
                            mGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha.toFixed(3)})`);
                            mGrad.addColorStop(0.55, `rgba(185, 200, 218, ${(alpha * 0.65).toFixed(3)})`);
                            mGrad.addColorStop(1, "rgba(185, 200, 218, 0)");
                            ctx.fillStyle = mGrad;
                            ctx.beginPath();
                            ctx.ellipse(px, py, rad * 1.35, rad * 0.85, -0.32, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        // Subtle resonant acoustic pressure waves
                        for (let r = 0; r < 3; r++) {
                            const waveProg = ((t * 1.6 + r * 0.33) % 1.0);
                            const wRad = 8 + waveProg * 48;
                            const wAlpha = (1.0 - waveProg) * 0.48 * roarAmt;
                            ctx.strokeStyle = `rgba(140, 162, 185, ${wAlpha.toFixed(3)})`;
                            ctx.lineWidth = 1.8;
                            ctx.beginPath();
                            ctx.arc(mouthWorldX + 4, mouthWorldY - 2, wRad, -0.85, 0.45);
                            ctx.stroke();
                        }
                        ctx.restore();
                    }
                } else {
                    drawProceduralDinoUpper(dinoX, dinoBobY, dinoPhase, roarAmt, t);
                }
            }

            // Render a complete Bullock Cart instance at horizontal offset cartX
            function renderBullockCartInstance(cartX, walkPhase, t, usePhoto) {
                // Cull if completely off-screen (bullock cart spans x = 136 + cartX to 418 + cartX)
                if (425 + cartX < -20 || 130 + cartX > LOGICAL_W + 20) return;

                const isMoving = state.playing && state.speedMult > 0.01;
                const strideScale = isMoving ? Math.min(1.15, 0.75 + state.speedMult * 0.25) : 0.0;
                const cowMooAmt = getRoarEnvelope(roarState.cowTimer, roarState.cowDur, 0.20, 0.72);

                const wheelGroundBump = getRoadBumpY(241.5 + cartX);
                const cowGroundBump = getRoadBumpY(345 + cartX);
                const cartBobY = wheelGroundBump * 0.85 + Math.sin(walkPhase * Math.PI * 4) * 0.36 * strideScale;
                const cowBobY = cowGroundBump * 0.8 + Math.sin(walkPhase * Math.PI * 4 - 0.5) * 0.52 * strideScale;
                const headNod = Math.sin(walkPhase * Math.PI * 4 + 0.6) * 0.8 * strideScale;

                const cowShadowGrad = ctx.createRadialGradient(
                    336 + cartX, 342, 4,
                    336 + cartX, 342, 48
                );
                cowShadowGrad.addColorStop(0, "rgba(28, 20, 14, 0.44)");
                cowShadowGrad.addColorStop(1, "rgba(28, 20, 14, 0)");
                ctx.fillStyle = cowShadowGrad;
                ctx.beginPath();
                ctx.ellipse(336 + cartX, 342, 48, 3.2, 0, 0, Math.PI * 2);
                ctx.fill();

                const wheelAngle = cartX / 35.5;
                // 1. Far-side wooden wheel (behind cart bed)
                drawWoodenWheel(234.5 + cartX, 307.5 + cartBobY, 34.5, wheelAngle + 0.32, false);

                // Compact wooden axle bolster under the cart bed
                ctx.fillStyle = "rgb(52, 40, 32)";
                ctx.fillRect(231 + cartX, 286 + cartBobY, 20, 14);

                const pBase = walkPhase;
                // 2. Far Zebu bullock's 4 legs + Near Zebu bullock's 2 far-side (left) legs
                drawAnatomicalCowLeg(314 + cartX, 304.5 + cowBobY, pBase + 0.05, true, false, usePhoto);
                drawAnatomicalCowLeg(308 + cartX, 304.5 + cowBobY, pBase + 0.55, true, false, usePhoto);
                drawAnatomicalCowLeg(360 + cartX, 306.5 + cowBobY, pBase + 0.02, false, false, usePhoto);
                drawAnatomicalCowLeg(364 + cartX, 306.5 + cowBobY, pBase + 0.52, false, false, usePhoto);

                drawAnatomicalCowLeg(305 + cartX, 304.0 + cowBobY, pBase + 0.60, true, true, usePhoto);
                drawAnatomicalCowLeg(359 + cartX, 306.5 + cowBobY, pBase + 0.12, false, true, usePhoto);

                // 3. Natural swaying Zebu tail with dark switch tuft at the tip
                const tailSway = Math.sin(t * 3.2 + pBase * 6) * 2.6 * (0.5 + 0.5 * state.windMult);
                const tailRootX = 296 + cartX;
                const tailRootY = 292 + cowBobY;
                const tailTipX = 292 + cartX + tailSway;
                const tailTipY = 325 + cowBobY;
                ctx.save();
                ctx.strokeStyle = "rgb(112, 98, 88)";
                ctx.lineWidth = 1.6;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(tailRootX, tailRootY);
                ctx.quadraticCurveTo(tailRootX - 2 + tailSway * 0.45, tailRootY + 17, tailTipX, tailTipY);
                ctx.stroke();
                // Dark hair switch tuft at tip of tail
                ctx.fillStyle = "rgb(46, 38, 32)";
                ctx.beginPath();
                ctx.ellipse(tailTipX, tailTipY + 2.5, 1.5, 4.2, -tailSway * 0.06, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 4. Near Zebu bullock's camera-side (right) legs tucked seamlessly into feathered hip & shoulder sockets
                drawAnatomicalCowLeg(311 + cartX, 304.0 + cowBobY, pBase + 0.28, true, true, usePhoto);
                drawAnatomicalCowLeg(355 + cartX, 306.5 + cowBobY, pBase + 0.56, false, true, usePhoto);

                // 5. Continuous 2x-Retina Strip-Sliced Cart Bed, Burlap Sacks, Driver & Zebu Bullocks (ZERO rectangular crop seams!)
                if (usePhoto && images.cartUpper.complete) {
                    const stripW = 2; // 2 logical px = 4 Retina source px in the 564x180 sprite
                    let muzzleWorldX = 414 + cartX;
                    let muzzleWorldY = 301 + cowBobY;

                    for (let lx = 0; lx < 282; lx += stripW) {
                        const wSlice = Math.min(stripW, 282 - lx);
                        const sx2 = lx * 2;
                        const sw2 = wSlice * 2;

                        let stripY = 232;
                        let shiftX = 0;
                        let stretchH = 90;

                        if (lx < 150) {
                            // Wooden cart bed, burlap sacks & seated driver move with cartBobY
                            stripY += cartBobY;
                        } else if (lx < 168) {
                            // Smooth Hermite blend across the harness/shaft junction between cartBobY and cowBobY (zero vertical cut line!)
                            const u = (lx - 150) / 18.0;
                            const s = u * u * (3.0 - 2.0 * u);
                            stripY += cartBobY * (1.0 - s) + cowBobY * s;
                        } else if (lx < 236) {
                            // Zebu bullocks' torso, flank & hump move with cowBobY + subtle ribcage breathing during moo
                            stripY += cowBobY;
                            if (cowMooAmt > 0.01 && lx >= 175 && lx <= 232) {
                                const flankSin = Math.sin(((lx - 175) / 57.0) * Math.PI);
                                const breathe = 1.0 + cowMooAmt * 0.028 * flankSin * (0.7 + 0.3 * Math.sin(t * 12.0));
                                stretchH = 90 * breathe;
                                stripY -= (stretchH - 90) * 0.55;
                            }
                        } else {
                            // Zebu bullocks' neck, dewlap, horns, ears & head (lx = 236..282):
                            // Smooth continuous anatomical curve as the bullock nods while walking or stretches its neck forward/upward to moo!
                            const nf = (lx - 236) / 46.0;
                            const walkNodY = headNod * 0.85 * Math.pow(nf, 1.15);
                            const mooLiftY = -cowMooAmt * 5.2 * Math.pow(nf, 1.35);
                            stripY += cowBobY + walkNodY + mooLiftY;
                            shiftX = cowMooAmt * 2.2 * Math.pow(nf, 1.25);
                        }

                        if (cowMooAmt > 0.03 && lx >= 268) {
                            // At the front of the muzzle (lx = 268..282), the anatomical mouth cleft is at y1x = 70.5 (y2 = 141):
                            // Upper muzzle/nostrils (y2 = 0..141) stay on stripY, while the lower lip/jaw (y2 = 141..180) drops open smoothly!
                            const jawProg = Math.min(1.0, (lx - 268) / 12.0);
                            const jawDrop = cowMooAmt * 2.6 * jawProg;

                            // Subtle warm dark interior mouth line inside the open muzzle
                            if (lx >= 270 && lx <= 278) {
                                ctx.fillStyle = `rgba(54, 24, 24, ${(0.78 * cowMooAmt).toFixed(2)})`;
                                ctx.fillRect(
                                    136 + lx + cartX + shiftX,
                                    stripY + 70.0,
                                    wSlice + 0.4,
                                    1.2 + jawDrop * 0.85
                                );
                            }

                            // Upper head & nostrils (y2 = 0..141 -> logical 0..70.5)
                            ctx.drawImage(
                                images.cartUpper,
                                sx2, 0, sw2, 141,
                                136 + lx + cartX + shiftX, stripY, wSlice + 0.55, 70.5
                            );
                            // Hinged lower jaw/chin (y2 = 141..180 -> logical 70.5..90)
                            ctx.drawImage(
                                images.cartUpper,
                                sx2, 141, sw2, 39,
                                136 + lx + cartX + shiftX, stripY + 70.5 + jawDrop, wSlice + 0.55, 19.5
                            );
                            if (lx >= 278) {
                                muzzleWorldX = 136 + lx + cartX + shiftX + 3;
                                muzzleWorldY = stripY + 70.5;
                            }
                        } else {
                            ctx.drawImage(
                                images.cartUpper,
                                sx2, 0, sw2, 180,
                                136 + lx + cartX + shiftX, stripY, wSlice + 0.55, stretchH
                            );
                        }
                    }

                    // Warm morning breath condensation mist & subtle sound ripples from the bullock's nostrils/muzzle during a moo
                    if (cowMooAmt > 0.05) {
                        const pNorm = roarState.cowTimer / roarState.cowDur;
                        ctx.save();
                        for (let i = 0; i < 4; i++) {
                            const puffAge = ((pNorm * 2.0 + i * 0.25) % 1.0);
                            const px = muzzleWorldX + 3 + puffAge * 24;
                            const py = muzzleWorldY - puffAge * 6 + Math.sin(t * 7 + i) * 1.4;
                            const rad = 2.5 + puffAge * 9.0;
                            const alpha = (1.0 - puffAge) * 0.48 * cowMooAmt;
                            const bGrad = ctx.createRadialGradient(px, py, 0.5, px, py, rad);
                            bGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha.toFixed(3)})`);
                            bGrad.addColorStop(0.55, `rgba(182, 198, 214, ${(alpha * 0.6).toFixed(3)})`);
                            bGrad.addColorStop(1, "rgba(182, 198, 214, 0)");
                            ctx.fillStyle = bGrad;
                            ctx.beginPath();
                            ctx.ellipse(px, py, rad * 1.35, rad * 0.85, -0.18, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        for (let r = 0; r < 2; r++) {
                            const rp = ((t * 1.8 + r * 0.5) % 1.0);
                            const rRad = 5 + rp * 24;
                            const rAlpha = (1.0 - rp) * 0.36 * cowMooAmt;
                            ctx.strokeStyle = `rgba(145, 165, 185, ${rAlpha.toFixed(3)})`;
                            ctx.lineWidth = 1.15;
                            ctx.beginPath();
                            ctx.arc(muzzleWorldX + 2, muzzleWorldY - 1, rRad, -0.65, 0.45);
                            ctx.stroke();
                        }
                        ctx.restore();
                    }
                } else {
                    drawProceduralCartAndCowsUpper(cartX, cartBobY, cowBobY, headNod, cowMooAmt);
                }

                // 6. Near-side rotating photorealistic wooden wheel (in front of cart bed)
                drawWoodenWheel(240.5 + cartX, 308.5 + cartBobY, 36.0, wheelAngle, true);
            }

            // -------------------------------------------------------------------------
            // 2B. LOW-ORBIT REALISTIC FLYING DRAGONS (3D Wing-Flapping + Fire Roar)
            // -------------------------------------------------------------------------
            function drawDragonFirePlume(jawX, jawY, roarAmt, t, scale) {
                if (roarAmt <= 0.03) return;
                ctx.save();
                ctx.translate(jawX, jawY);
                ctx.scale(scale, scale);
                ctx.rotate(0.05);

                const plumeLen = 112 * roarAmt;

                // 0. Continuous tapered flame jet core connecting directly from inside the dragon's open throat!
                const jetGrad = ctx.createLinearGradient(0, 0, plumeLen, 0);
                jetGrad.addColorStop(0.0, `rgba(255, 255, 240, ${(0.96 * roarAmt).toFixed(2)})`);
                jetGrad.addColorStop(0.22, `rgba(255, 215, 75, ${(0.90 * roarAmt).toFixed(2)})`);
                jetGrad.addColorStop(0.58, `rgba(255, 92, 14, ${(0.75 * roarAmt).toFixed(2)})`);
                jetGrad.addColorStop(0.88, `rgba(165, 28, 8, ${(0.35 * roarAmt).toFixed(2)})`);
                jetGrad.addColorStop(1.0, "rgba(60, 20, 15, 0)");

                const wisp1 = Math.sin(t * 22.0) * 4.5;
                const wisp2 = Math.cos(t * 18.0) * 6.5;
                ctx.fillStyle = jetGrad;
                ctx.beginPath();
                ctx.moveTo(-4, -1.8);
                ctx.quadraticCurveTo(plumeLen * 0.38, -8.5 * roarAmt + wisp1 * 0.5, plumeLen, -14.0 * roarAmt + wisp2);
                ctx.quadraticCurveTo(plumeLen * 0.88, wisp1, plumeLen * 0.96, 12.0 * roarAmt + wisp2);
                ctx.quadraticCurveTo(plumeLen * 0.35, 9.5 * roarAmt - wisp1 * 0.5, -4, 2.2);
                ctx.closePath();
                ctx.fill();

                // 1. Dense overlapping billowing flame tongues & smoke clouds (24 layers for zero gaps)
                for (let i = 0; i < 24; i++) {
                    const frac = i / 23;
                    const fx = frac * plumeLen + Math.sin(t * 20 + i * 1.1) * 2.2;
                    const fy = Math.sin(t * 15 - i * 0.65) * (1.2 + frac * 7.5) - frac * frac * 4.5;
                    const rOuter = (2.8 + frac * 20.0) * (0.82 + 0.18 * Math.sin(t * 25 + i)) * roarAmt;

                    const fGrad = ctx.createRadialGradient(fx, fy, rOuter * 0.08, fx, fy, rOuter);
                    if (frac < 0.25) {
                        fGrad.addColorStop(0.0, `rgba(255, 255, 240, ${(0.92 * roarAmt).toFixed(2)})`);
                        fGrad.addColorStop(0.5, `rgba(255, 205, 70, ${(0.78 * roarAmt).toFixed(2)})`);
                        fGrad.addColorStop(1.0, "rgba(255, 90, 12, 0)");
                    } else if (frac < 0.70) {
                        fGrad.addColorStop(0.0, `rgba(255, 215, 85, ${(0.80 * roarAmt).toFixed(2)})`);
                        fGrad.addColorStop(0.52, `rgba(242, 88, 16, ${(0.64 * roarAmt).toFixed(2)})`);
                        fGrad.addColorStop(1.0, "rgba(135, 20, 6, 0)");
                    } else {
                        const fade = (1.0 - frac) / 0.30;
                        fGrad.addColorStop(0.0, `rgba(225, 68, 14, ${(0.55 * fade * roarAmt).toFixed(2)})`);
                        fGrad.addColorStop(0.55, `rgba(58, 44, 38, ${(0.36 * fade * roarAmt).toFixed(2)})`);
                        fGrad.addColorStop(1.0, "rgba(28, 22, 20, 0)");
                    }
                    ctx.fillStyle = fGrad;
                    ctx.beginPath();
                    ctx.ellipse(fx, fy, rOuter * 1.4, rOuter * 0.86, 0.1 * Math.sin(t * 10 + i), 0, Math.PI * 2);
                    ctx.fill();
                }

                // 2. Glowing white-hot / golden-orange embers carried in the jet
                for (let e = 0; e < 12; e++) {
                    const ep = ((t * 4.2 + e * 0.083) % 1.0);
                    const ex = ep * plumeLen * 1.15;
                    const ey = Math.sin(e * 4.3 + t * 14) * (2.5 + ep * 14) - ep * 6;
                    const eAlpha = (1.0 - ep) * 0.9 * roarAmt;
                    ctx.fillStyle = e % 2 === 0
                        ? `rgba(255, 248, 190, ${eAlpha.toFixed(2)})`
                        : `rgba(255, 135, 30, ${eAlpha.toFixed(2)})`;
                    ctx.beginPath();
                    ctx.arc(ex, ey, 1.1 + (1.0 - ep) * 1.3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            function drawProceduralDragon(baseX, baseY, scale, flapPhase, isSecond, roarAmt, t) {

                ctx.fillStyle = wGrad;
                ctx.beginPath();

                ctx.quadraticCurveTo(-55, -28, -22, 6);
