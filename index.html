                ctx.restore();
                if (roarAmt > 0.03) {
                    drawDragonFirePlume(baseX + 285 * scale, baseY + (heaveY + 20 + headLift) * scale, roarAmt, t, scale);
                }
            }

            // Renders a single photorealistic articulated Dragon at (dragonX, baseY) with scale and flapPhase
            function renderSingleDragon(dragonX, baseY, scale, flapPhase, isSecond, t, usePhoto) {
                if (dragonX + 410 * scale < -30 || dragonX - 30 > LOGICAL_W + 30) return;

                const roarAmt = getRoarEnvelope(roarState.dragonTimer, roarState.dragonDur, 0.14, 0.76);
                const flapCos = Math.cos(flapPhase);
                const flapSin = Math.sin(flapPhase);
                const heaveY = -flapCos * 8.0 * scale;
                const pitchAngle = flapSin * 0.035 - roarAmt * 0.06;

                // 1. Moving Ground Shadow cast onto the Dirt Embankment (y = 340) as the low-orbit dragon swoops overhead!
                const shadowCenterX = dragonX + 165 * scale;
                if (shadowCenterX > -80 && shadowCenterX < LOGICAL_W + 80) {
                    const wingSpanFactor = 0.65 + 0.35 * (1.0 - Math.abs(flapCos));
                    const shRx = 72 * scale * wingSpanFactor;
                    const shRy = 3.6 * scale;
                    const shGrad = ctx.createRadialGradient(shadowCenterX, 340.5, 4, shadowCenterX, 340.5, shRx);
                    shGrad.addColorStop(0, "rgba(18, 14, 10, 0.36)");
                    shGrad.addColorStop(0.6, "rgba(18, 14, 10, 0.16)");
                    shGrad.addColorStop(1, "rgba(18, 14, 10, 0)");
                    ctx.fillStyle = shGrad;
                    ctx.beginPath();
                    ctx.ellipse(shadowCenterX, 340.5, shRx, shRy, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (!usePhoto || !images.dragonAtlas.complete) {
                    drawProceduralDragon(dragonX, baseY, scale, flapPhase, isSecond, roarAmt, t);
                    return;
                }

                ctx.save();
                ctx.translate(dragonX, baseY + heaveY);
                ctx.scale(scale, scale);

                // Centered slight pitch around shoulder (181, 17)
                ctx.translate(181, 17);
                ctx.rotate(pitchAngle);
                ctx.translate(-181, -17);

                // --- A. FAR WING (Behind Dragon Body: sx=156, sy=74, sw=69, sh=108 in dragonAtlas) ---
                const farCos = Math.cos(flapPhase - 0.20);
                const farSin = Math.sin(flapPhase - 0.20);
                const farScaleY = Math.sign(farCos || 1) * Math.max(0.14, Math.abs(farCos));
                const farScaleX = 1.0 + (1.0 - Math.abs(farCos)) * 0.10;
                const farRot = -farSin * 0.08;

                ctx.save();
                ctx.translate(205.0, 11.8);
                ctx.rotate(farRot);
                ctx.scale(farScaleX, farScaleY);
                ctx.drawImage(
                    images.dragonAtlas,
                    156, 74, 69, 108,
                    -28.6, -104.2, 69, 108
                );
                ctx.restore();

                // --- B. UNDULATING DRAGON BODY, TAIL, TALONS, NECK & ROARING JAWS (sx=0, sy=0, sw=288, sh=73) ---
                const stripW = 6;
                let tipWaveY = 0;
                for (let lx = 0; lx < 288; lx += stripW) {
                    const wSlice = Math.min(stripW, 288 - lx);
                    let waveY = 0;
                    if (lx < 130) {
                        const tf = (130 - lx) / 130;
                        waveY = Math.sin(flapPhase - tf * 2.4) * 5.2 * (tf * tf);
                    } else if (lx > 200) {
                        const nf = (lx - 200) / 88;
                        // Sinuous neck rears upward when roaring and breathing fire!
                        waveY = Math.sin(flapPhase - 0.6 - nf * 1.2) * 3.0 * Math.pow(nf, 1.2) - roarAmt * 11.0 * Math.pow(nf, 1.28);
                    }

                    if (roarAmt > 0.02 && lx >= 262) {
                        // Separate Upper Horned Skull (y = 0..18) and Fanged Lower Jaw (y = 18..32) cleanly without rectangular fill artifacts
                        const jawProg = Math.min(1.0, (lx - 262) / 22);
                        const skullLift = -roarAmt * 3.0 * jawProg;
                        const jawDrop = roarAmt * 5.5 * jawProg;

                        ctx.drawImage(
                            images.dragonAtlas,
                            lx, 0, wSlice, 18,
                            lx, waveY + skullLift, wSlice + 0.75, 18
                        );
                        ctx.drawImage(
                            images.dragonAtlas,
                            lx, 18, wSlice, 55,
                            lx, waveY + 18 + jawDrop, wSlice + 0.75, 55
                        );
                    } else {
                        ctx.drawImage(
                            images.dragonAtlas,
                            lx, 0, wSlice, 73,
                            lx, waveY, wSlice + 0.75, 73
                        );
                    }
                    if (lx + stripW >= 288) {
                        tipWaveY = waveY;
                    }
                }

                // --- B2. DRACONIC FIRE-BREATH PLUME ERUPTING FROM OPEN JAWS ---
                if (roarAmt > 0.03) {
                    drawDragonFirePlume(276, 19 + tipWaveY, roarAmt, t + (isSecond ? 0.7 : 0.0), 1.0);
                }

                // --- C. NEAR WING (In Front of Shoulder: sx=0, sy=74, sw=155, sh=157 in dragonAtlas) ---
                const nearScaleY = Math.sign(flapCos || 1) * Math.max(0.14, Math.abs(flapCos) * (flapCos < 0 ? 0.86 : 1.0));
                const nearScaleX = 1.0 + (1.0 - Math.abs(flapCos)) * 0.12;
                const nearRot = -flapSin * 0.11;

                ctx.save();
                ctx.translate(181.4, 16.8);
                ctx.rotate(nearRot);
                ctx.scale(nearScaleX, nearScaleY);
                ctx.drawImage(
                    images.dragonAtlas,
                    0, 74, 155, 157,
                    -133.1, -150.4, 155, 157
                );
                ctx.restore();

                ctx.restore();
            }

            // Renders the Pair of Low-Orbit Dragons flying across the scene in formation
            function renderLowOrbitDragonsPair(leadDragonX, t, usePhoto) {
                const dragon2X = leadDragonX - 215;
                const dragon2Y = 112 + Math.sin(t * 1.6 + 1.4) * 5.5;
                const flapPhase2 = t * 6.8 + 2.1;
                renderSingleDragon(dragon2X, dragon2Y, 0.84, flapPhase2, true, t, usePhoto);

                const dragon1Y = 172 + Math.sin(t * 1.4) * 6.5;
                const flapPhase1 = t * 6.4;
                renderSingleDragon(leadDragonX, dragon1Y, 1.02, flapPhase1, false, t, usePhoto);
            }

            // -------------------------------------------------------------------------
            // 2C. BIPEDAL KAIJU GODZILLA RENDERER & SKYWARD ROAR KINEMATICS (Stage 4)
            // -------------------------------------------------------------------------
            function getGodzillaLegKinematics(hipX, hipY, baseGroundY, phase) {
                const p = ((phase % 1.0) + 1.0) % 1.0;
                const stanceRatio = 0.60;
                const dxFront = 30.0;
                const dxBack = -34.0;

                if (p < stanceRatio) {
                    const t = p / stanceRatio;
                    const footX = hipX + dxFront + (dxBack - dxFront) * t;
                    const groundY = baseGroundY + getRoadBumpY(footX);
                    const kneeX = hipX + (footX - hipX) * 0.54 + 12.0;
                    const kneeY = hipY + (groundY - hipY) * 0.42;
                    const footTilt = t > 0.82 ? ((t - 0.82) / 0.18) * 0.35 : 0.0;
                    return { kneeX, kneeY, footX, footY: groundY, footTilt };
                } else {
                    const t = (p - stanceRatio) / (1.0 - stanceRatio);
                    const st = t * t * (3 - 2 * t);
                    const lag = Math.sin(t * Math.PI) * 5.5;
                    const footX = hipX + dxBack + (dxFront - dxBack) * st - lag;
                    const groundY = baseGroundY + getRoadBumpY(footX);
                    const lift = Math.sin(t * Math.PI) * 10.5;
                    const footY = groundY - lift;
                    const kneeX = hipX + (footX - hipX) * 0.56 + 13.5 + Math.sin(t * Math.PI) * 4.5;
                    const kneeY = hipY + (groundY - hipY) * 0.40 - lift * 0.55;
                    const footTilt = Math.sin(t * Math.PI) * 0.32 * (1.0 - t * 0.6);
                    return { kneeX, kneeY, footX, footY, footTilt };
                }
            }

            function drawGodzillaLeg(hipX, hipY, phase, isNear, usePhoto) {
                const baseGroundY = isNear ? 341.8 : 340.4;
                const { kneeX, kneeY, footX, footY, footTilt } = getGodzillaLegKinematics(hipX, hipY, baseGroundY, phase);
                const ankleX = footX - Math.sin(footTilt) * 9.0;
                const ankleY = footY - 11.5 * Math.cos(footTilt);

                const distFromGround = Math.max(0, (baseGroundY + getRoadBumpY(footX)) - footY);
                const shAlpha = Math.max(0.16, 0.54 - distFromGround * 0.03);
                const shGrad = ctx.createRadialGradient(footX + 6, baseGroundY + 1, 4, footX + 6, baseGroundY + 1, 28);
                shGrad.addColorStop(0, `rgba(18, 14, 10, ${shAlpha.toFixed(2)})`);
                shGrad.addColorStop(1, "rgba(18, 14, 10, 0)");
                ctx.fillStyle = shGrad;
                ctx.beginPath();
                ctx.ellipse(footX + 6, baseGroundY + 1, 28, 3.8, 0, 0, Math.PI * 2);
                ctx.fill();

                if (usePhoto && images.godzillaAtlas.complete) {
                    const dxU = kneeX - hipX;
                    const dyU = kneeY - hipY;
                    const lenU = Math.hypot(dxU, dyU);
                    const angU = Math.atan2(dyU, dxU) - Math.PI * 0.5;
                    const scaleU = lenU / 34.0;
                    const sxThigh = isNear ? 0 : 60;

                    ctx.save();
                    ctx.translate(hipX, hipY);
                    ctx.rotate(angU);
                    ctx.drawImage(
                        images.godzillaAtlas,
                        sxThigh, 198, 59, 52,
                        -29.0, -9.0 * scaleU, 59, 52 * scaleU
                    );
                    ctx.restore();

                    const dxL = ankleX - kneeX;
                    const dyL = ankleY - kneeY;
                    const lenL = Math.hypot(dxL, dyL);
                    const angL = Math.atan2(dyL, dxL) - Math.PI * 0.5;
                    const scaleL = lenL / 36.0;
                    const sxShin = isNear ? 120 : 166;

                    ctx.save();
                    ctx.translate(kneeX, kneeY);
                    ctx.rotate(angL);
                    ctx.drawImage(
                        images.godzillaAtlas,
                        sxShin, 198, 45, 48,
                        -23.0, -6.5 * scaleL, 45, 48 * scaleL
                    );
                    ctx.restore();

                    const sxFoot = isNear ? 212 : 268;
                    ctx.save();
                    ctx.translate(ankleX, ankleY);
                    ctx.rotate(footTilt);
                    ctx.drawImage(
                        images.godzillaAtlas,
                        sxFoot, 198, 55, 24,
                        -21.0, -10.5, 55, 24
                    );
                    ctx.restore();
                    return;
                }

                ctx.save();
                ctx.fillStyle = isNear ? "rgb(54, 58, 60)" : "rgb(38, 42, 44)";
                ctx.beginPath();
                ctx.moveTo(hipX - 18, hipY);
                ctx.lineTo(hipX + 18, hipY);
                ctx.lineTo(kneeX + 14, kneeY);
                ctx.lineTo(kneeX - 14, kneeY);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(kneeX - 13, kneeY);
                ctx.lineTo(kneeX + 13, kneeY);
                ctx.lineTo(footX + 18, footY);
                ctx.lineTo(footX - 12, footY);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            function renderGodzillaInstance(godzillaX, gPhase, t, usePhoto) {
                if (godzillaX + 360 < -20 || godzillaX - 20 > LOGICAL_W + 20) return;

                const roarAmt = getRoarEnvelope(roarState.godzillaTimer, roarState.godzillaDur, 0.14, 0.78);
                const roarShudder = roarAmt > 0.05 ? Math.sin(t * 52.0) * 0.9 * roarAmt : 0.0;
                const isMoving = state.playing && state.speedMult > 0.01;
                const strideScale = isMoving ? (1.0 - roarAmt * 0.65) : 0.0;
                const groundBump = getRoadBumpY(225 + godzillaX);
                const godzillaBobY = groundBump + Math.sin(gPhase * Math.PI * 4) * 2.2 * strideScale;

                // Broad ambient ground shadow under Godzilla
                const gShGrad = ctx.createRadialGradient(
                    225 + godzillaX, 341, 10,
                    225 + godzillaX, 341, 95
                );
                gShGrad.addColorStop(0, "rgba(16, 12, 8, 0.48)");
                gShGrad.addColorStop(1, "rgba(16, 12, 8, 0)");
                ctx.fillStyle = gShGrad;
                ctx.beginPath();
                ctx.ellipse(225 + godzillaX, 341, 95, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // 1. Far Bipedal Leg (Left Leg, phase + 0.12) drawn behind groin/belly
                drawGodzillaLeg(248 + godzillaX, 253 + godzillaBobY, gPhase + 0.12, false, usePhoto);

                // 2. Near Bipedal Leg (Right Leg) tucked into feathered Near Hip socket
                drawGodzillaLeg(212 + godzillaX, 250 + godzillaBobY, gPhase + 0.62, true, usePhoto);

                // 3. Godzilla Upper Body, Dorsal Plates, Clawed Arms, & Skyward Roaring Head/Jaws
                if (usePhoto && images.godzillaAtlas.complete) {
                    const baseY = 126 + godzillaBobY;

                    // --- A. PULSING CHERENKOV ATOMIC BLUE-CYAN DORSAL SPINE GLOW DURING ROAR ---
                    if (roarAmt > 0.02) {
                        ctx.save();
                        const spinePts = [
                            { x: 162, y: 88, r: 16 },
                            { x: 186, y: 62, r: 22 },
                            { x: 212, y: 38, r: 28 },
                            { x: 238, y: 20, r: 30 },
                            { x: 264, y: 14, r: 26 },
                            { x: 288, y: 16, r: 22 }
                        ];
                        for (let i = 0; i < spinePts.length; i++) {
                            const sp = spinePts[i];
                            const pulse = 0.72 + 0.28 * Math.sin(t * 24.0 - i * 0.7);
                            const torsoFrac = Math.max(0, (sp.x - 190) / 115);
                            const liftY = -roarAmt * 18.0 * Math.pow(torsoFrac, 1.25);
                            const gx = godzillaX + sp.x - roarAmt * 6.0 * torsoFrac;
                            const gy = baseY + sp.y + liftY;
                            const rad = sp.r * (0.85 + 0.35 * roarAmt) * pulse;
                            const gGrad = ctx.createRadialGradient(gx, gy, 2, gx, gy, rad);
                            gGrad.addColorStop(0.0, `rgba(195, 248, 255, ${(0.72 * roarAmt * pulse).toFixed(3)})`);
                            gGrad.addColorStop(0.45, `rgba(38, 198, 255, ${(0.45 * roarAmt * pulse).toFixed(3)})`);
                            gGrad.addColorStop(1.0, "rgba(0, 110, 255, 0)");
                            ctx.fillStyle = gGrad;
                            ctx.beginPath();
                            ctx.arc(gx, gy, rad, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }

                    // --- B. TAIL, ARCHING TORSO & CLAWED ARMS (lx = 0 .. 306, plus arm region y >= 82 for lx = 306..320) ---
                    const stripW = 4;
                    const neckCutX = 306;
                    for (let lx = 0; lx < 322; lx += stripW) {
                        const wSlice = Math.min(stripW, 322 - lx);
                        let waveY = 0;
                        let shiftX = 0;
                        if (lx < 185) {
                            const tf = (185 - lx) / 185;
                            waveY = Math.sin(gPhase * Math.PI * 4 - tf * 2.4) * 5.0 * (tf * tf) * strideScale + roarAmt * 6.0 * tf * tf;
                        } else if (lx >= 246) {
                            // Rear the upper chest, shoulders & neck upward starting at lx=246 so pelvis/hips (lx=185..246) stay 100% locked to the legs!
                            const bf = (lx - 246) / 60;
                            const stepNod = lx > 275 ? Math.sin(gPhase * Math.PI * 4 + 0.6) * 1.8 * ((lx - 275) / 74) * strideScale : 0;
                            waveY = stepNod - roarAmt * 16.5 * Math.pow(bf, 1.25) + roarShudder * 0.5 * bf;
                            shiftX = -roarAmt * 4.5 * Math.pow(bf, 1.25);
                        }

                        if (lx < neckCutX) {
                            ctx.drawImage(
                                images.godzillaAtlas,
                                lx, 0, wSlice, 197,
                                godzillaX + lx + shiftX, baseY + waveY, wSlice + 0.65, 197
                            );
                        } else {
                            // For lx = 306..322, draw ONLY the lower chest & clawed hands (y = 82..197) so the head (y = 0..64) can pivot freely!
                            ctx.drawImage(
                                images.godzillaAtlas,
                                lx, 82, wSlice, 115,
                                godzillaX + lx + shiftX, baseY + 82 + waveY + roarAmt * 6.0, wSlice + 0.65, 115
                            );
                        }
                    }

                    // --- C. SKYWARD-TILTING HEAD, UPPER SKULL & WIDE-GAPING LOWER JAW (sx = 302..349, sy = 0..66) ---
                    // Pivot at neck base (306, 38) lifted by the arched torso at lx = 306:
                    const neckWorldX = godzillaX + 306 - roarAmt * 4.5;
                    const neckWorldY = baseY + 38 - roarAmt * 16.5 + roarShudder;
                    // Head tilts strongly skyward (-0.68 rad = -39 deg, plus torso arch = -48 deg looking up at the sky!)
                    const skywardHeadAngle = -0.68 * roarAmt;
                    const jawOpenAngle = 0.44 * roarAmt; // Lower jaw drops wide open (+25 deg relative to neck, 64 deg gape relative to skull!)

                    ctx.save();
                    ctx.translate(neckWorldX, neckWorldY);

                    // 1. Glowing oral cavity & fanged palate between the gaping upper skull and lower jaw
                    if (roarAmt > 0.04) {
                        ctx.save();
                        ctx.rotate(skywardHeadAngle * 0.55);
                        const mawGrad = ctx.createRadialGradient(22, 4, 1, 22, 4, 18);
                        mawGrad.addColorStop(0.0, `rgba(130, 235, 255, ${(0.88 * roarAmt).toFixed(2)})`);
                        mawGrad.addColorStop(0.55, `rgba(92, 24, 28, ${(0.92 * roarAmt).toFixed(2)})`);
                        mawGrad.addColorStop(1.0, "rgba(28, 12, 14, 0)");
                        ctx.fillStyle = mawGrad;
                        ctx.beginPath();
                        ctx.moveTo(4, -2);
                        ctx.lineTo(35, -12 * roarAmt);
                        ctx.lineTo(33, 14 * roarAmt);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }

                    // 2. Upper Skull, Snout & Eyes (sx = 302..349, sy = 0..43) tilted steeply up at the sky!
                    ctx.save();
                    ctx.rotate(skywardHeadAngle);
                    ctx.drawImage(
                        images.godzillaAtlas,
                        302, 0, 47, 44,
                        -4, -38, 47, 44
                    );
                    // Subtle row of upper fangs along the open upper jaw
                    if (roarAmt > 0.12) {
                        ctx.fillStyle = `rgba(235, 240, 245, ${(0.85 * roarAmt).toFixed(2)})`;
                        for (let fx = 16; fx <= 36; fx += 4) {
                            ctx.beginPath();
                            ctx.moveTo(fx, 4);
                            ctx.lineTo(fx + 1.4, 7.2);
                            ctx.lineTo(fx + 2.8, 4);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                    ctx.restore();

                    // 3. Lower Jaw & Chin (sx = 304..349, sy = 43..66) hinged wide open!
                    ctx.save();
                    ctx.rotate(skywardHeadAngle + jawOpenAngle);
                    ctx.drawImage(
                        images.godzillaAtlas,
                        304, 43, 45, 23,
                        -2, 3, 45, 23
                    );
                    if (roarAmt > 0.12) {
                        ctx.fillStyle = `rgba(230, 236, 242, ${(0.85 * roarAmt).toFixed(2)})`;
                        for (let fx = 15; fx <= 33; fx += 4) {
                            ctx.beginPath();
                            ctx.moveTo(fx, 4);
                            ctx.lineTo(fx + 1.3, 0.8);
                            ctx.lineTo(fx + 2.6, 4);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                    ctx.restore();

                    // 4. SKYWARD ROAR ACOUSTIC SHOCKWAVE RINGS & ATOMIC VAPOR STREAMING TOWARD THE HEAVENS
                    if (roarAmt > 0.05) {
                        ctx.save();
                        ctx.rotate(skywardHeadAngle * 0.78);
                        const pNorm = roarState.godzillaTimer / roarState.godzillaDur;

                        // Ionized skyward breath mist & roaring vapor cone shooting up into the sky
                        for (let i = 0; i < 8; i++) {
                            const vAge = ((pNorm * 2.8 + i * 0.125) % 1.0);
                            const vx = 32 + vAge * 78;
                            const vy = -2 + Math.sin(t * 16 + i * 1.3) * (2 + vAge * 10);
                            const vRad = 5 + vAge * 24;
                            const vAlpha = (1.0 - vAge) * 0.36 * roarAmt;
                            const vGrad = ctx.createRadialGradient(vx, vy, 1, vx, vy, vRad);
                            vGrad.addColorStop(0.0, `rgba(210, 248, 255, ${vAlpha.toFixed(3)})`);
                            vGrad.addColorStop(0.5, `rgba(120, 215, 255, ${(vAlpha * 0.65).toFixed(3)})`);
                            vGrad.addColorStop(1.0, "rgba(120, 215, 255, 0)");
                            ctx.fillStyle = vGrad;
                            ctx.beginPath();
                            ctx.ellipse(vx, vy, vRad * 1.45, vRad * 0.82, 0, 0, Math.PI * 2);
                            ctx.fill();
                        }

                        // Expanding concentric skyward acoustic shockwave arcs
                        for (let r = 0; r < 4; r++) {
                            const rProg = ((t * 2.2 + r * 0.25) % 1.0);
                            const rRad = 14 + rProg * 72;
                            const rAlpha = (1.0 - rProg) * 0.42 * roarAmt;
                            ctx.strokeStyle = r % 2 === 0
                                ? `rgba(185, 242, 255, ${rAlpha.toFixed(3)})`
                                : `rgba(245, 250, 255, ${(rAlpha * 0.8).toFixed(3)})`;
                            ctx.lineWidth = 1.8 * (1.0 - rProg * 0.5);
                            ctx.beginPath();
                            ctx.arc(30, 0, rRad, -0.68, 0.68);
                            ctx.stroke();
                        }
                        ctx.restore();
                    }

                    ctx.restore();
                } else {
                    // Procedural Godzilla body fallback with skyward roar posture
                    ctx.save();
                    ctx.translate(godzillaX, 126 + godzillaBobY);
                    ctx.fillStyle = "rgb(46, 50, 52)";
                    ctx.beginPath();
                    ctx.moveTo(4, 192);
                    ctx.quadraticCurveTo(110, 145, 195, 65 - roarAmt * 12);
                    ctx.quadraticCurveTo(255, 15 - roarAmt * 22, 345, 42 - roarAmt * 32);
                    ctx.lineTo(342, 62 - roarAmt * 18);
                    ctx.quadraticCurveTo(285, 85, 275, 145);
                    ctx.quadraticCurveTo(215, 155, 165, 155);
                    ctx.quadraticCurveTo(95, 178, 4, 192);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
            }

            // -------------------------------------------------------------------------
            // MAIN RENDER PIPELINE
            // -------------------------------------------------------------------------
            function renderScene(dt, t) {
                ctx.save();
                ctx.scale(SCALE, SCALE);

                const usePhoto = state.renderMode === "photorealistic" && assetsReady;

                // 1. BACKGROUND SKY, DISTANT MISTY TREELINE & EMBANKMENT
                if (usePhoto) {
                    ctx.drawImage(images.bgClean, 0, 0, LOGICAL_W, LOGICAL_H);

                    const stripH = 4;
                    for (let sy = 282; sy < 330; sy += stripH) {
                        const heightFactor = (330 - sy) / 48;
                        const windShift = getWindAt(850, sy, t) * 1.45 * heightFactor;
                        ctx.drawImage(
                            images.bgClean,
                            640, sy, 360, stripH,
                            640 + windShift, sy, 360, stripH
                        );
                    }
                } else {
                    drawProceduralBackground(t);
                }

                // 2. ANIMATED LEFT ROW OF 9 YOUNG TREES (x=0..146, y=280..336)
                if (usePhoto) {
                    const treeY0 = 280;
                    const treeH = 56;
                    const sliceStep = 2;
                    for (let ly = 0; ly < treeH; ly += sliceStep) {
                        const gy = treeY0 + ly;
                        const elev = Math.pow((treeH - ly) / treeH, 1.35);
                        const breeze = getWindAt(70, gy, t);
                        const swayX = breeze * 3.5 * elev;
                        const swayY = Math.abs(breeze) * 0.4 * elev;
                        ctx.drawImage(
                            images.leftTrees,
                            0, ly, 146, sliceStep,
                            swayX, gy + swayY, 146, sliceStep
                        );
                    }

                    for (let i = 0; i < leftTreeDefs.length; i++) {
                        const td = leftTreeDefs[i];
                        const breeze = getWindAt(td.trunkX, td.topY, t);
                        for (let c = 0; c < td.clusters.length; c += 4) {
                            const cl = td.clusters[c];
                            const hFac = Math.pow((334 - cl.cy) / 48, 1.35);
                            const lx = cl.cx + breeze * 3.5 * hFac + Math.sin(t * 6 + cl.phase) * 0.65 * state.windMult;
                            const ly = cl.cy + Math.cos(t * 5 + cl.phase) * 0.35 * state.windMult;
                            ctx.fillStyle = "rgba(52, 76, 62, 0.32)";
                            ctx.beginPath();
                            ctx.ellipse(lx, ly, 1.7, 1.0, breeze * 0.2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                } else {
                    drawProceduralLeftTrees(t);
                }

                // 3. TWO THIN EMBANKMENT SAPLINGS SWAYING IN THE BREEZE
                for (let i = 0; i < saplings.length; i++) {
                    const sap = saplings[i];
                    const wind = getWindAt(sap.baseX, sap.baseY - sap.height, t);
                    const tipBend = wind * 4.2;
                    const midBend = wind * 1.6;
                    const topX = sap.baseX + tipBend;
                    const topY = sap.baseY - sap.height + Math.abs(tipBend) * 0.12;

                    ctx.strokeStyle = sap.color;
                    ctx.lineWidth = 1.1;
                    ctx.beginPath();
                    ctx.moveTo(sap.baseX, sap.baseY);
                    ctx.quadraticCurveTo(sap.baseX + midBend, sap.baseY - sap.height * 0.55, topX, topY);
                    ctx.stroke();

                    ctx.lineWidth = 0.7;
                    for (let j = 0; j < sap.twigs.length; j++) {
                        const tw = sap.twigs[j];
                        const bx = sap.baseX + tipBend * (tw.yFrac * tw.yFrac);
                        const by = sap.baseY - sap.height * tw.yFrac;
                        ctx.beginPath();
                        ctx.moveTo(bx, by);
                        ctx.lineTo(bx + tw.dx + wind * 0.8, by + tw.dy);
                        ctx.stroke();
                    }
                }

                // 4. STRICT 4-STAGE SEQUENTIAL TURN:
                // Stage 1: Cow Cart -> Stage 2: Dinosaur -> Stage 3: 2 Low-Orbit Dragons -> Stage 4: Godzilla
                const u = ((state.travelDist % CYCLE_SPAN) + CYCLE_SPAN) % CYCLE_SPAN;
                const s2End = CART_PHASE_SPAN + DINO_PHASE_SPAN;
                const s3End = s2End + DRAGONS_PHASE_SPAN;

                if (u < CART_PHASE_SPAN) {
                    const cartX = -425 + u;
                    const walkPhaseCart = (u - 425) / 26.5;
                    renderBullockCartInstance(cartX, walkPhaseCart, t, usePhoto);
                } else if (u < s2End) {
                    const dinoU = u - CART_PHASE_SPAN;
                    const dinoX = -585 + dinoU;
                    const walkPhaseDino = (dinoU - 585) / 54.0;
                    renderDinosaurInstance(dinoX, walkPhaseDino, t, usePhoto);
                } else if (u < s3End) {
                    const dragU = u - s2End;
                    const leadDragonX = -310 + (dragU / DRAGONS_PHASE_SPAN) * 1550;
                    renderLowOrbitDragonsPair(leadDragonX, t, usePhoto);
                } else {
                    const godzU = u - s3End;
                    const godzillaX = -355 + godzU;
                    const walkPhaseGodzilla = (godzU - 355) / 64.0;
                    renderGodzillaInstance(godzillaX, walkPhaseGodzilla, t, usePhoto);
                }

                // 5. SUBTLE EMBANKMENT CREST GRASS TUFTS (in front of hooves/feet)
                for (let i = 0; i < embankmentTufts.length; i++) {
                    const tf = embankmentTufts[i];
                    const wind = getWindAt(tf.bx, tf.by, t);
                    const sway = tf.lean + wind * (tf.h * 0.26);
                    ctx.strokeStyle = tf.col;
                    ctx.lineWidth = 0.75;
                    ctx.beginPath();
                    ctx.moveTo(tf.bx, tf.by);
                    ctx.quadraticCurveTo(tf.bx + sway * 0.45, tf.by - tf.h * 0.55, tf.bx + sway, tf.by - tf.h);
                    ctx.stroke();
                }

                // 6. FOREGROUND LUSH GREEN PADDY FIELD MOVING BY THE BREEZE (y=356..411)
                if (usePhoto) {
                    const fieldY0 = 356;
                    const fieldH = LOGICAL_H - fieldY0;
                    const fStep = 2;
                    for (let fy = fieldY0; fy < LOGICAL_H; fy += fStep) {
                        const depthFrac = (fy - fieldY0) / fieldH;
                        const waveShift = getWindAt(500, fy, t) * (1.0 + depthFrac * 3.0);
                        ctx.drawImage(
                            images.bgClean,
                            0, fy, LOGICAL_W, fStep,
                            waveShift, fy, LOGICAL_W, fStep
                        );
                    }
                }

                ctx.lineCap = "round";
                for (let i = 0; i < paddyBlades.length; i++) {
                    const b = paddyBlades[i];
                    if (usePhoto && (i % 2 === 1)) continue;

                    const wind = getWindAt(b.baseX, b.baseY, t);
                    const bend = b.naturalLean + wind * (b.height * 0.35) * b.stiffness;
                    const tipX = b.baseX + bend;
                    const tipY = b.baseY - Math.sqrt(Math.max(3, b.height * b.height - bend * bend * 0.4));
                    const midX = b.baseX + bend * 0.42;
                    const midY = (b.baseY + tipY) * 0.5 - 0.8;

                    ctx.strokeStyle = wind > 0.85 * state.windMult ? b.tipColor : b.color;
                    ctx.lineWidth = b.width;
                    ctx.beginPath();
                    ctx.moveTo(b.baseX, b.baseY);
                    ctx.quadraticCurveTo(midX, midY, tipX, tipY);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // -------------------------------------------------------------------------
            // WEB AUDIO API REALISTIC & RELATIVE SPATIAL SOUND ENGINE + EMBEDDED MP3s

            const RELATIVE_AUDIO = {

            function playRelativeSound(filename, volume) {
                try {
                    const audio = new Audio(encodeURI(filename));
                    audio.volume = Math.max(0, Math.min(1, volume));
                    const p = audio.play();
                    if (p && typeof p.catch === "function") p.catch(() => {});
                } catch (e) {}
            }

            function loadRelativeAudioBuffers() {
                if (!audioCtx || audioBuffersLoading) return;
                audioBuffersLoading = true;

                const loadBuffer = (filename, onDecoded) => {
                    fetch(encodeURI(filename))
                        .then(res => {
                            if (!res.ok) throw new Error("HTTP " + res.status);
                            return res.arrayBuffer();
                        })
                        .then(arrBuf => audioCtx.decodeAudioData(arrBuf))
                        .then(decodedBuf => onDecoded(decodedBuf))
                        .catch(() => {
                            // Fetch blocked under file:// CORS; seamlessly plays via HTML5 Audio relative playback
                        });
                };

                loadBuffer(RELATIVE_AUDIO.dinoRoar, buf => { brachiosaurusRoarBuffer = buf; });
                loadBuffer(RELATIVE_AUDIO.dragonRoar, buf => { dragonRoarBuffer = buf; });
                loadBuffer(RELATIVE_AUDIO.godzillaRoar, buf => { godzillaRoarBuffer = buf; });
                loadBuffer(RELATIVE_AUDIO.godzillaFootstep, buf => { godzillaFootstepBuffer = buf; });

                const pan = Math.max(-0.88, Math.min(0.88, (xPos - 500) / 480));
                return { proximity: proximity * proximity, pan };
            }

            function createPanner(panVal) {
                if (!audioCtx) return null;
                if (typeof audioCtx.createStereoPanner === "function") {
                    const p = audioCtx.createStereoPanner();
                    p.pan.value = panVal;
                    p.connect(masterGain);
                    return p;
                }
                return masterGain;
            }

            function ensureAudioInitialized() {
                if (audioCtx) return true;

                if (!AudioContextClass) return false;

                audioCtx = new AudioContextClass();

                masterGain.connect(audioCtx.destination);

                loadRelativeAudioBuffers();

                const bufSize = audioCtx.sampleRate * 4;
                noiseBuffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.045;
                    b6 = white * 0.115926;
                }

                const windSrc1 = audioCtx.createBufferSource();
                windSrc1.buffer = noiseBuffer;
                windSrc1.loop = true;
                windLowFilter = audioCtx.createBiquadFilter();
                windLowFilter.type = "bandpass";
                windLowFilter.frequency.value = 260;
                windLowFilter.Q.value = 2.0;
                windLowGain = audioCtx.createGain();
                windLowGain.gain.value = 0.08;
                windSrc1.connect(windLowFilter);
                windLowFilter.connect(windLowGain);
                windLowGain.connect(masterGain);
                windSrc1.start(0);

                const windSrc2 = audioCtx.createBufferSource();
                windSrc2.buffer = noiseBuffer;
                windSrc2.loop = true;
                windHighFilter = audioCtx.createBiquadFilter();
                windHighFilter.type = "bandpass";
                windHighFilter.frequency.value = 1850;
                windHighFilter.Q.value = 1.4;
                windHighGain = audioCtx.createGain();
                windHighGain.gain.value = 0.025;
                windSrc2.connect(windHighFilter);
                windHighFilter.connect(windHighGain);
                windHighGain.connect(masterGain);
                windSrc2.start(0);

                creakOsc = audioCtx.createOscillator();
                creakOsc.type = "sawtooth";
                creakOsc.frequency.value = 135;
                creakFilter = audioCtx.createBiquadFilter();
                creakFilter.type = "bandpass";
                creakFilter.frequency.value = 310;
                creakFilter.Q.value = 7.5;
                creakGain = audioCtx.createGain();
                creakGain.gain.value = 0.0;
                creakPanner = createPanner(0);
                creakOsc.connect(creakFilter);

                creakGain.connect(creakPanner);
                creakOsc.start(0);

                return true;
            }

            function triggerCowHoofAndBell(xPos, stepIdx) {

                stepSrc.connect(stepFilter);
                stepFilter.connect(stepGain);

            function initOrToggleAudio() {

            function updateRoarsAndAudio(dt, t) {
                // 1. Advance active physical roar/call animation timers
                if (roarState.cowTimer > 0) {
                    roarState.cowTimer += dt;
                    if (roarState.cowTimer >= roarState.cowDur) roarState.cowTimer = 0;
                }
                if (roarState.dinoTimer > 0) {
                    roarState.dinoTimer += dt;
                    if (roarState.dinoTimer >= roarState.dinoDur) roarState.dinoTimer = 0;
                }
                if (roarState.dragonTimer > 0) {
                    roarState.dragonTimer += dt;
                    if (roarState.dragonTimer >= roarState.dragonDur) roarState.dragonTimer = 0;
                }
                if (roarState.godzillaTimer > 0) {
                    roarState.godzillaTimer += dt;
                    if (roarState.godzillaTimer >= roarState.godzillaDur) roarState.godzillaTimer = 0;
                }

                const isMoving = state.playing && state.speedMult > 0.02;
                const u = ((state.travelDist % CYCLE_SPAN) + CYCLE_SPAN) % CYCLE_SPAN;
                const s2End = CART_PHASE_SPAN + DINO_PHASE_SPAN;
                const s3End = s2End + DRAGONS_PHASE_SPAN;

                // 2. Automatic nature-accurate roar/call triggers when each animal is in mid-stage view
                if (isMoving) {
                    if (u < CART_PHASE_SPAN) {
                        const cartX = -425 + u;
                        const { proximity } = getSpatialAudioParams(340 + cartX);
                        if (proximity > 0.45 && roarState.cowTimer === 0 && (t - roarState.lastCowAutoTime > 6.8 || roarState.lastCowAutoTime < 0)) {
                            roarState.cowTimer = 0.001;
                            roarState.lastCowAutoTime = t;
                            triggerCowMoo(385 + cartX);
                        }
                    } else if (u < s2End) {
                        const dinoX = -585 + (u - CART_PHASE_SPAN);
                        const { proximity } = getSpatialAudioParams(380 + dinoX);
                        if (proximity > 0.48 && roarState.dinoTimer === 0 && (t - roarState.lastDinoAutoTime > 6.2 || roarState.lastDinoAutoTime < 0)) {
                            roarState.dinoTimer = 0.001;
                            roarState.lastDinoAutoTime = t;
                            triggerSauropodBellow(480 + dinoX);
                        }
                    } else if (u < s3End) {
                        const dragU = u - s2End;
                        const leadDragonX = -310 + (dragU / DRAGONS_PHASE_SPAN) * 1550;
                        const { proximity } = getSpatialAudioParams(leadDragonX + 150);
                        if (proximity > 0.50 && roarState.dragonTimer === 0 && (t - roarState.lastDragonAutoTime > 5.4 || roarState.lastDragonAutoTime < 0)) {
                            roarState.dragonTimer = 0.001;
                            roarState.lastDragonAutoTime = t;
                            triggerDragonRoar(leadDragonX + 220);
                        }
                    } else {
                        const godzillaX = -355 + (u - s3End);
                        const { proximity } = getSpatialAudioParams(235 + godzillaX);
                        if (proximity > 0.48 && roarState.godzillaTimer === 0 && (t - roarState.lastGodzillaAutoTime > 5.8 || roarState.lastGodzillaAutoTime < 0)) {
                            roarState.godzillaTimer = 0.001;
                            roarState.lastGodzillaAutoTime = t;
                            triggerGodzillaRoar(290 + godzillaX);
                        }
                    }
                }

                // 3. Continuous & Footstep/Wing-Flap Web Audio Synthesis
                if (!audioCtx || !state.audioEnabled) {
                    if (windLowGain) windLowGain.gain.setTargetAtTime(0, audioCtx ? audioCtx.currentTime : 0, 0.05);
                    if (windHighGain) windHighGain.gain.setTargetAtTime(0, audioCtx ? audioCtx.currentTime : 0, 0.05);
                    if (creakGain) creakGain.gain.setTargetAtTime(0, audioCtx ? audioCtx.currentTime : 0, 0.05);
                    return;
                }
                if (audioCtx.state === "suspended") {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                const fieldWind = Math.abs(getWindAt(500, 360, t));
                const lowWindLevel = Math.min(0.24, (0.045 + fieldWind * 0.055) * state.windMult);
                const highRustleLevel = Math.min(0.09, (0.012 + fieldWind * 0.024) * state.windMult);
                windLowGain.gain.setTargetAtTime(lowWindLevel, now, 0.08);
                windLowFilter.frequency.setTargetAtTime(190 + fieldWind * 140 * state.windMult, now, 0.10);
                windHighGain.gain.setTargetAtTime(highRustleLevel, now, 0.08);
                windHighFilter.frequency.setTargetAtTime(1500 + fieldWind * 650, now, 0.10);

                if (u >= CART_PHASE_SPAN || !isMoving) {
                    creakGain.gain.setTargetAtTime(0, now, 0.05);
                }

                if (u < CART_PHASE_SPAN) {
                    const cartX = -425 + u;
                    const centerCartX = 280 + cartX;
                    const { proximity, pan } = getSpatialAudioParams(centerCartX);
                    if (creakPanner && creakPanner.pan) {
                        creakPanner.pan.setTargetAtTime(pan, now, 0.05);
                    }

                    if (isMoving) {
                        const wheelPhase = (u / 35.5) % (Math.PI * 2);
                        const creakPulse = Math.pow(Math.max(0, Math.sin(wheelPhase * 2)), 6);
                        creakOsc.frequency.setTargetAtTime(110 + creakPulse * 55, now, 0.03);
                        creakFilter.frequency.setTargetAtTime(280 + creakPulse * 140, now, 0.03);
                        creakGain.gain.setTargetAtTime(
                            creakPulse * 0.026 * proximity * Math.min(1.5, state.speedMult),
                            now,
                            0.03
                        );

                        const walkPhaseCart = (u - 425) / 26.5;
                        const cowStepIdx = Math.floor(walkPhaseCart * 4.0);
                        if (cowStepIdx !== audioTrackers.lastCowStepIndex) {
                            audioTrackers.lastCowStepIndex = cowStepIdx;
                            triggerCowHoofAndBell(340 + cartX, Math.abs(cowStepIdx));
                        }
                    }
                } else if (u < s2End) {
                    const dinoU = u - CART_PHASE_SPAN;
                    const dinoX = -585 + dinoU;
                    const walkPhaseDino = (dinoU - 585) / 54.0;

                    if (isMoving) {
                        const legOffsets = [0.02, 0.27, 0.52, 0.77];
                        const legXOffsets = [317, 374, 298, 398];
                        for (let i = 0; i < 4; i++) {
                            const sIdx = Math.floor(walkPhaseDino + legOffsets[i]);
                            if (sIdx !== audioTrackers.lastDinoStepIndices[i]) {
                                audioTrackers.lastDinoStepIndices[i] = sIdx;
                                triggerSauropodFootstep(legXOffsets[i] + dinoX);
                            }
                        }
                    }
                } else if (u < s3End) {
                    const dragU = u - s2End;
                    const leadDragonX = -310 + (dragU / DRAGONS_PHASE_SPAN) * 1550;
                    const dragon2X = leadDragonX - 215;

                    const flap1Idx = Math.floor((t * 6.4 - 1.2) / (Math.PI * 2));
                    if (flap1Idx !== audioTrackers.lastDragonFlap1) {
                        audioTrackers.lastDragonFlap1 = flap1Idx;
                        triggerDragonWingFlap(leadDragonX + 160, 1.02);
                    }

                    const flap2Idx = Math.floor((t * 6.8 + 2.1 - 1.2) / (Math.PI * 2));
                    if (flap2Idx !== audioTrackers.lastDragonFlap2) {
                        audioTrackers.lastDragonFlap2 = flap2Idx;
                        triggerDragonWingFlap(dragon2X + 140, 0.84);
                    }
                } else {
                    const godzU = u - s3End;
                    const godzillaX = -355 + godzU;
                    const walkPhaseGodzilla = (godzU - 355) / 64.0;

                    if (isMoving) {
                        const gOffsets = [0.12, 0.62];
                        const gXOffsets = [248, 212];
                        for (let i = 0; i < 2; i++) {
                            const gIdx = Math.floor(walkPhaseGodzilla + gOffsets[i]);
                            if (gIdx !== audioTrackers.lastGodzillaStepIndices[i]) {
                                audioTrackers.lastGodzillaStepIndices[i] = gIdx;
                                triggerGodzillaStomp(gXOffsets[i] + godzillaX);
                            }
                        }
                    }
                }
            }

            // -------------------------------------------------------------------------
            // UI CONTROLS & DRAG INTERACTIVITY
            // -------------------------------------------------------------------------
            const btnPlay = document.getElementById("btn-play");
            const btnReset = document.getElementById("btn-reset");
            const btnNextStage = document.getElementById("btn-next-stage");
            const btnRoar = document.getElementById("btn-roar");
            const btnMode = document.getElementById("btn-mode");
            const btnFit = document.getElementById("btn-fit");
            const btnAudio = document.getElementById("btn-audio");
            const btnToggleHud = document.getElementById("btn-toggle-hud");
            const statusBadge = document.getElementById("status-badge");
            const sliderSpeed = document.getElementById("slider-speed");
            const sliderWind = document.getElementById("slider-wind");

            btnPlay.addEventListener("click", () => {
                state.playing = !state.playing;
                btnPlay.textContent = state.playing ? "Pause" : "Play";
                btnPlay.classList.toggle("active", state.playing);
            });

            function updateStageButtonLabel() {
                const u = ((state.travelDist % CYCLE_SPAN) + CYCLE_SPAN) % CYCLE_SPAN;
                const s2End = CART_PHASE_SPAN + DINO_PHASE_SPAN;
                const s3End = s2End + DRAGONS_PHASE_SPAN;
                if (u < CART_PHASE_SPAN) {
                    btnNextStage.textContent = "Next: Dinosaur";
                    if (btnRoar) {
                        btnRoar.textContent = "Moo: Cow Cart";
                        btnRoar.classList.toggle("active", roarState.cowTimer > 0);
                    }
                } else if (u < s2End) {
                    btnNextStage.textContent = "Next: 2 Dragons";
                    if (btnRoar) {
                        btnRoar.textContent = "Roar: Dinosaur";
                        btnRoar.classList.toggle("active", roarState.dinoTimer > 0);
                    }
                } else if (u < s3End) {
                    btnNextStage.textContent = "Next: Godzilla";
                    if (btnRoar) {
                        btnRoar.textContent = "Roar: Dragons";
                        btnRoar.classList.toggle("active", roarState.dragonTimer > 0);
                    }
                } else {
                    btnNextStage.textContent = "Next: Cow Cart";
                    if (btnRoar) {
                        btnRoar.textContent = "Roar: Godzilla";
                        btnRoar.classList.toggle("active", roarState.godzillaTimer > 0);
                    }
                }
            }

            if (btnRoar) {
                btnRoar.addEventListener("click", () => {
                    if (!state.audioEnabled) {
                        initOrToggleAudio();
                    }
                    triggerActiveCreatureRoar(true);
                    updateStageButtonLabel();
                });
            }

            btnReset.addEventListener("click", () => {
                state.travelDist = 425;
                updateStageButtonLabel();
            });

            btnNextStage.addEventListener("click", () => {
                const u = ((state.travelDist % CYCLE_SPAN) + CYCLE_SPAN) % CYCLE_SPAN;
                const s2End = CART_PHASE_SPAN + DINO_PHASE_SPAN;
                const s3End = s2End + DRAGONS_PHASE_SPAN;
                if (u < CART_PHASE_SPAN) {
                    state.travelDist = CART_PHASE_SPAN + 585;
                    roarState.dinoTimer = 0.001;
                    roarState.lastDinoAutoTime = state.windTime;
                    triggerSauropodBellow(480);
                } else if (u < s2End) {
                    state.travelDist = s2End + 820;
                    roarState.dragonTimer = 0.001;
                    roarState.lastDragonAutoTime = state.windTime;
                    triggerDragonRoar(520);
                } else if (u < s3End) {
                    state.travelDist = s3End + 640;
                    roarState.godzillaTimer = 0.001;
                    roarState.lastGodzillaAutoTime = state.windTime;
                    triggerGodzillaRoar(540);
                } else {
                    state.travelDist = 425;
                    roarState.cowTimer = 0.001;
                    roarState.lastCowAutoTime = state.windTime;
                    triggerCowMoo(385);
                }
                updateStageButtonLabel();
            });

            btnMode.addEventListener("click", () => {
                state.renderMode = state.renderMode === "photorealistic" ? "procedural" : "photorealistic";
                const isPhoto = state.renderMode === "photorealistic";
                btnMode.textContent = isPhoto ? "Mode: Photorealistic" : "Mode: Pure Procedural JS";
                btnMode.classList.toggle("active", !isPhoto);
                statusBadge.textContent = isPhoto
                    ? "Sequential Procession: Cow Cart → Dinosaur → 2 Dragons → Godzilla • Drag canvas to scrub"
                    : "100% Pure Procedural Canvas 2D Mode • Cow Cart → Dinosaur → 2 Dragons → Godzilla";
            });

            btnFit.addEventListener("click", () => {
                state.fillScreen = !state.fillScreen;
                document.body.classList.toggle("fill-screen", state.fillScreen);
                btnFit.textContent = state.fillScreen ? "Fit: Fullscreen" : "Fit: Aspect";
                btnFit.classList.toggle("active", state.fillScreen);
            });

            btnAudio.addEventListener("click", initOrToggleAudio);

            btnToggleHud.addEventListener("click", () => {
                state.hudVisible = !state.hudVisible;
                document.body.classList.toggle("hud-hidden", !state.hudVisible);
                btnToggleHud.textContent = state.hudVisible ? "Hide Controls" : "Show Controls";
            });

            sliderSpeed.addEventListener("input", (e) => {
                state.speedMult = parseFloat(e.target.value);
            });

            sliderWind.addEventListener("input", (e) => {
                state.windMult = parseFloat(e.target.value);
            });

            function getLogicalMouseX(clientX) {
                const rect = canvas.getBoundingClientRect();
                return ((clientX - rect.left) / Math.max(1, rect.width)) * LOGICAL_W;
            }

            canvas.addEventListener("pointerdown", (e) => {
                state.dragging = true;
                state.dragStartX = getLogicalMouseX(e.clientX);
                state.dragStartDist = state.travelDist;
                canvas.setPointerCapture(e.pointerId);
            });

            canvas.addEventListener("pointermove", (e) => {
                if (!state.dragging) return;
                const currX = getLogicalMouseX(e.clientX);
                const dx = currX - state.dragStartX;
                state.travelDist = state.dragStartDist + dx;
            });

            canvas.addEventListener("pointerup", () => {
                state.dragging = false;
            });

            canvas.addEventListener("pointercancel", () => {
                state.dragging = false;
            });

            let lastTime = performance.now();
            let animFrameId = null;

            function tick(now) {
                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;

                state.windTime += dt;

                if (state.playing && !state.dragging) {
                    // Godzilla briefly braces his stride while roaring skyward!
                    const godzRoarBrace = roarState.godzillaTimer > 0
                        ? (1.0 - 0.65 * getRoarEnvelope(roarState.godzillaTimer, roarState.godzillaDur, 0.14, 0.78))
                        : 1.0;
                    const dx = 45.0 * state.speedMult * godzRoarBrace * dt;
                    state.travelDist += dx;
                }

                updateRoarsAndAudio(dt, state.windTime);
                updateStageButtonLabel();
                renderScene(dt, state.windTime);

                animFrameId = requestAnimationFrame(tick);
            }

            window.onload = function () {
                if (animFrameId) cancelAnimationFrame(animFrameId);
                lastTime = performance.now();
                animFrameId = requestAnimationFrame(tick);
            };
        })();
    </script>
</body>

</html>
